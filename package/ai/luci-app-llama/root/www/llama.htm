        if (ntool === "mem") continue;
        /* 新卡片条件：
         *   1. 前面没有"模型(Ns)"行（框架预执行）
         *   2. 当前卡片已有内容、且插件名不同 —— 一次任务里框架可能连着输出
         *      两条（[jq] 出表格、[doc] 出 xlsx），以前后一条会覆盖前一条，
         *      用户看到的卡片内容就是错位的（表格卡片里显示 xlsx 的结论）。
         */
        if (!cur || (cur.result && cur.tool !== ntool)){
          cur = {no:String(steps.length + 1), tool:ntool,
                 arg:cur ? "框架续接" : "框架自动执行", secs:""};
          steps.push(cur);
        }
        cur.result = (cur.result ? cur.result + "\n" : "") + mRes[2].trim();
        continue;
      }
      if (/^最终回答/.test(L)){
        /* 多行答案要一直收到 [统计] 为止。否则 BOTTOM10 这种答案是
           "标题 + 10 行数据"，只取第一行就只剩个空标题 ——
           用户看到的正是"只有标题不展示数据"。 */
        var finLines = [L.replace(/^最终回答[^:]*:\s*/, "")];
        while (i + 1 < lines.length && !/^\[统计\]/.test(lines[i + 1])
               /* 插件结果行 / 框架步骤行不是答案的一部分：以前无条件收，
                  插件原始 JSON 会被并进答案气泡，页面上就是一坨
                  {"value":"..."}（math 解题过程就是这么露出来的）。 */
               && !/^\s*\[[a-zA-Z_]+\]\s*\{/.test(lines[i + 1])
               && !/^【/.test(lines[i + 1])){
          i++;
          finLines.push(lines[i]);
        }
        tail.push({type:"final", text: finLines.join("\n")});
        continue;
      }
      if (/^\[统计\]/.test(L)){ tail.push({type:"stat", text:L}); continue; }
      if (/^(⚠|✗|!|↻|  ✗|  !|  ↻)/.test(L)){ tail.push({type:"warn", text:L.trim()}); continue; }
      /* 都不匹配的行：当作上一条工具结果的续行（多行输出很常见） */
      if (cur) cur.result += (cur.result ? "\n" : "") + L.trim();
    }

    var h = '<div class="agent-wrap">';
    for (var k = 0; k < steps.length; k++){
      var s = steps[k];
      h += '<div class="astep' + (s.tool === "生成中" ? " streaming" : "") + '">'
         + '<div class="astep-h"><b>' + esc(s.no) + '</b>';
      h += '<span class="chip">' + esc(s.tool) + '</span>';
      if (s.arg) h += '<code>' + esc(s.arg) + '</code>';
      if (s.secs) h += '<span class="secs">' + esc(s.secs) + 's</span>';
      h += '</div>';
      if (s.result){
        /* 推理/正文类内容不截太狠：math 的推导有 500 字，截 260 就等于没了。
           卡片本身有 max-height + 滚动，长内容能自己滚。 */
        /* 插件结果的展示长度：解题过程是 markdown 表格，几百字节很正常，
         * 截到 260 就等于把过程砍没了（用户看到"只有结果没有过程"）。
         * 卡片自己有 max-height + 滚动，不怕长。 */
        var limit = 4000;
        var r = s.result.length > limit ? s.result.slice(0, limit) + " …" : s.result;
        var full = " full";
        /* 插件 JSON 由 pluginResultHtml 自己出链接/播放器；再套一层 linkFiles
         * 会把它已经生成的 href="...%2Ftts_x.mp3" 再"链接化"一遍，
         * 结果就是气泡里 4 个下载按钮 + 半截 %2F 路径漏成文字（实测）。 */
        var _isJson = /^\s*\{/.test(r);
        var _card = pluginResultHtml(r);
        h += '<div class="astep-r' + full + '">'
           + (_isJson ? _card : linkFiles(_card)) + '</div>';
      }
      h += '</div>';
    }
    for (var j = 0; j < tail.length; j++){
      var o = tail[j];
      if (o.type === "final") h += '<div class="afinal">' + linkFiles(render(o.text, false)) + '</div>';
      else if (o.type === "stat") h += '<div class="astat">' + esc(o.text) + '</div>';
      else h += '<div class="awarn">' + esc(o.text) + '</div>';
    }
    if (!steps.length && !tail.length){
      h += '<div class="astep-r">' + esc(String(text || "（等待输出…）")) + '</div>';
    }
    /* 统一给表格套滚动容器：宽表格在表格自己身上滚，滚动条不会被
       几十行内容推到气泡最底下 */
    return wrapTables(h) + '</div>';
  }
  window.renderAgentLog = renderAgentLog;   /* 方便控制台调试/测试 */

  /* ===== 文件上传：纯文本模型读不了 PDF/Word/Excel =====
     上传时服务端就用 doc 插件转成 .txt，页面只记住文本路径；
     发任务时把路径塞进任务里，agent 用 read 工具读。 */
  var UPLOADS = [];                      // 本会话已上传的文本文件
  var fileInput = document.getElementById("fileinput");
  /* 设置按钮：输入框旁边常驻的齿轮，比藏在右上角的铅笔和聊天里的 AI 头像
   * 都好找。用户反馈 AI 头像点不动，这里给一个绝对明确的入口。 */
  document.getElementById("setbtn").addEventListener("click", function(){
    try { editQuick(); } catch (e) { console.error("open settings failed", e); }
  });
  document.getElementById("upbtn").addEventListener("click", function(){
    fileInput.click();
  });
  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (f.size > 17 * 1024 * 1024){ toast("文件太大（上限 17MB，base64 后约 23MB，服务端上限 24MB）"); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var b64 = String(fr.result).split(",")[1] || "";
      toast("上传并转换中… " + f.name, 60000);
      /* 上传 + 解析是同步的：大文件要几秒。先在气泡里挂一条"正在解析"，
       * 成功/失败都就地改它 —— 以前只在 toast 里闪一下，失败了用户看不到。 */
      var t0 = Date.now();
      /* 【老 bug】以前每条上传气泡都写死 id="upmsg"，getElementById 永远拿到第一条，
       * 于是第二次上传去改第一次的气泡：两张图的"正在解析"互相覆盖，
       * 上一张的名字变成"……"，而且第一个请求还挂着不结束 → 页面像卡死。
       * 现在每次上传自己建一个 div，直接持有引用，不再靠 id 找。 */
      var upId = "upmsg_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      addMsg("bot", '<div class="awarn" id="' + upId + '">正在解析 <b>' + esc(f.name) + '</b> …'
        + (b64.length > 900000 ? '<br><span style="color:#7c8794">文件较大（'
            + (b64.length * 0.75 / 1048576).toFixed(1) + ' MB），稍等几秒</span>' : '')
        + '</div>');
      scrollDown(true);
      var upNode = document.getElementById(upId);   /* 只属于这一次上传 */
      function upDone(html){
        if (upNode && upNode.parentNode) upNode.innerHTML = html;
        else addMsg("bot", html);
        scrollDown(true);
      }
      fetch("/cgi-bin/agent?upload=1" + (/\.(jpg|jpeg|png|bmp|webp)$/i.test(f.name) ? "&noocr=1" : ""), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        /* 超时控制：没有它的话，连接半开（服务端不响应/被掐）会一直停在"解析中" */
        signal: (window.AbortController ? (function(){ var c = new AbortController();
                 setTimeout(function(){ try{ c.abort(); }catch(e){} }, 180000); return c.signal; })() : undefined),
        body: JSON.stringify({name: f.name, data: b64})
      }).then(function(r){
          return r.text().then(function(t){
            try { return JSON.parse(t); }
            catch (e) { throw new Error("服务端返回异常（HTTP " + r.status + "）：" + t.slice(0, 120)); }
          });
      }).then(function(j){
          if (!j.ok) throw new Error(j.error || "上传失败");
          UPLOADS.push({name: j.name, file: j.file, chars: j.chars, info: j.info});
          /* 标明这次是谁解析的：builtin=内置文本，plugin=doc 插件 */
          var how = j.builtin ? "内置文本"
                  : (j.plugin ? (j.plugin + " 插件解析") : "");
          var kindTxt = j.kind ? (" · " + j.kind) : "";
          var secs = ((Date.now() - t0) / 1000).toFixed(1);
          upDone('<div class="awarn">已上传 <b>' + esc(j.name) + '</b>（'
            + esc(j.kind === "image" ? "图片·OCR" : (j.kind === "audio" ? "音频·转写" : (kindTxt ? kindTxt.slice(3) : "文件")))
            + '，' + (j.chars > 0 ? (j.chars + ' 字') : '未识别文字') + '，用时 ' + secs + 's）'
            + (how ? '<br><span style="color:#7c8794;font-size:calc(12.5px * var(--fs))">解析方式：'
                     + esc(how) + '</span>' : '')
            + (j.kind === "image"
                ? '<div class="fixcard">'
                  + '<div class="fixt">这张图还能处理</div>'
                  + '<div class="fixd">放大变清晰（NPU）、去阴影取白底（拍照的 A4 纸）、去摩尔纹（拍屏幕）、识别文字</div>'
                  + '<div class="fixb">'
                  + '<a href="javascript:void 0" class="fixlink" data-p="' + esc(j.path || "") + '" data-s="4">🪄 修复 4 倍</a>'
                  + '<a href="javascript:void 0" class="fixlink ghost" data-p="' + esc(j.path || "") + '" data-s="2">2 倍（更平滑）</a>'
                  + '<a href="javascript:void 0" class="fixlink alt" data-w="1" data-p="' + esc(j.path || "") + '">☀ 去阴影 / 背景取白</a>'
                  + '<a href="javascript:void 0" class="fixlink ghost" data-ocr="1" data-p="' + esc(j.path || "") + '">🔍 识别文字</a>'
                  + '<a href="javascript:void 0" class="fixlink alt2" data-m="2" data-p="' + esc(j.path || "") + '">📺 去摩尔纹</a>'
                  + '</div></div>'
                : '<br>现在已经转成纯文本，可以直接让我总结 / 翻译 / 就内容提问。')
            + '</div>');
          toast("");
      }).catch(function(e){
          var m = (e && e.name === "AbortError") ? "超过 180 秒没响应（图片太大或板子忙）"
                  : (e && e.message ? e.message : String(e));
          upDone('<div class="awarn" style="border-color:#a13b3b">上传失败：' + esc(m)
            + '<br><span style="color:#7c8794">文件没用上。换个格式或把文件拆小一点再试。</span></div>');
          toast("上传失败：" + m);
      });
    };
    fr.readAsDataURL(f);
  });

  function uploadsRef(){
    if (!UPLOADS.length) return "";
    return "【用户已上传的文件（服务端已转成纯文本，用 read 工具读）】\n"
         + UPLOADS.map(function(u){ return u.file; }).join("\n")
         + "\n\n";
  }


  /* ============ 高危操作确认 ============
   * 原则：改密码 / 重启 / 改配置 / 执行命令 / 写系统路径这类操作，
   * 必须让【用户本人】在页面上点一下确认。
   *
   * 插件侧的 confirm:"yes" 只是防模型顺手乱调的内部参数，模型自己就会填，
   * 所以它【不能】代替用户确认。正确做法是：
   *   前端检测到高危 op → 弹窗问用户 → 用户点"确认执行" → 前端才补上
   *   confirm:"yes" 发给插件 → 插件放行。
   * 模型绕过前端直接调（没有 confirm）→ 插件拒绝。
   */
  var DANGER_OPS = {
    passwd:     {label: "修改用户密码",   why: "改完立刻生效。SSH 和 LuCI 都要用新密码；格式不对会把自己锁在门外（这块板的 dropbear 只认 $1$/$5$/$6$，不认 bcrypt）。"},
    reboot:     {label: "重启设备",       why: "所有连接断开，约 30-60 秒恢复。正在跑的任务会中断。"},
    uci_set:    {label: "修改配置项",     why: "只写文件不生效，但会影响下次启动或下次 commit。"},
    uci_delete: {label: "删除配置项",     why: "删掉后相关功能失效，只能手动重建。"},
    uci_commit: {label: "提交配置生效",   why: "提交后立刻生效。改错（尤其 network/firewall/dropbear）会断网或锁死。"},
    shell:      {label: "执行命令",       why: "命令以 root 权限运行，后果自负。"},
    write:      {label: "写文件",         why: "会覆盖目标路径的原有内容。"},
    download:   {label: "下载文件",       why: "会写入目标路径，来源不可信时有风险。"},
    sysupgrade: {label: "固件升级",       why: "刷写系统分区，失败会变砖。"},
    opkg:       {label: "安装/卸载软件包", why: "改动系统文件，可能影响依赖。"}
  };

  /* 系统目录：写这些东西 = 高危；写 /tmp 之类 = 低危不用打扰用户 */
  var SYS_DIRS = ["/etc", "/usr", "/bin", "/sbin", "/lib", "/rom", "/root",
                  "/overlay", "/opt/llama", "/dev", "/proc", "/sys", "/boot"];

  /* 命令内容里的危险动作。shell / 脚本里出现这些，光看 op 是看不出来的：
   * rm 不在 shell 白名单里，但 sed -i、find -delete、awk 重定向、
   * python3 x.py 全都是"能改文件"的后门（我自己就是靠 python3 救的回板子）。 */
  var CMD_DANGER = [
    {re: /\brm\b/,                    label: "删除文件 (rm)"},
    {re: /\bdd\b/,                    label: "裸写块设备 (dd)"},
    {re: /\bmkfs/,                    label: "格式化分区 (mkfs)"},
    {re: /\bsed\s+-i/,                label: "原地修改文件 (sed -i)"},
    {re: /\bfind\b[\s\S]*-delete/,     label: "批量删除 (find -delete)"},
    {re: /\b(truncate|shred)\b/,      label: "清空/粉碎文件"},
    {re: /\bchmod\b|\bchown\b/,       label: "改权限或属主"},
    {re: /\b(mv|cp)\b/,               label: "移动/复制（会覆盖目标）"},
    {re: />>?\s*\//,                  label: "重定向写入文件 (> file)"},
    {re: /\b(python3|node)\b/,        label: "执行脚本（等同任意代码）"},
    {re: /\b(reboot|halt|poweroff)\b/, label: "关机/重启"},
    {re: /\b(kill|killall)\b/,        label: "杀进程"},
    {re: /\bopkg\s+(remove|install)/, label: "装/卸载软件包"},
    {re: /\buci\s+(set|delete|commit)/, label: "改 UCI 配置"}
  ];

  /* 根本不该让它执行的操作：不给"确认"机会，直接拒 */
  var HARD_BLOCK = [
    {re: /\brm\s+(-\w+\s+)*\/(\s|$)/,                label: "删除根目录"},
    {re: /\brm\s+(-\w+\s+)*\/(etc|usr|bin|sbin|lib|rom|overlay|boot)\b/, label: "删除系统目录"},
    {re: /\bdd\b[\s\S]*of=\/dev\//,                   label: "dd 直接写裸设备"},
    {re: /\bmkfs/,                                    label: "格式化分区"},
    {re: />>?\s*\/etc\/(shadow|passwd)/,              label: "覆盖 shadow/passwd"},
    {re: /\bchmod\s+(-R\s+)?000\b/,                   label: "把权限清成 000（会锁死）"},
    {re: /\b(sysupgrade|mtd\s+write|mtd\s+erase)\b/,  label: "刷写固件/闪存"}
  ];

  function inSysDir(p) {
    p = String(p || "");
    if (!p) return "";
    for (var i = 0; i < SYS_DIRS.length; i++) {
      var d = SYS_DIRS[i];
      if (p === d || p.indexOf(d + "/") === 0) return d;
    }
    return "";
  }

  /* 从任务文本里识别危险程度。
   * 返回 null（都不用问）或 {op,label,why,args,risks[],blocked}
   *   blocked=true  → 硬拒绝，不给确认
   *   risks 非空     → 确认框里逐条列出"具体要干什么" */
  function dangerOf(task) {
    var t = String(task || "").trim();
    if (t.charAt(0) !== "{") return null;
    var j;
    try { j = JSON.parse(t); } catch (e) { return null; }

    var op = String(j.op || "").toLowerCase();
    var base = DANGER_OPS[op];       /* op 本身是不是高危 */
    var risks = [];
    var blocked = "";
    var label = base ? base.label : "";
    var why = base ? base.why : "";

    /* ---- 命令内容检查（shell / cmd / 参数里藏的动作）---- */
    var cmdText = [j.cmd, j.command, j.script, j.value, j.content].filter(Boolean).join("\n");
    if (cmdText) {
      HARD_BLOCK.forEach(function (r) {
        if (!blocked && r.re.test(cmdText)) blocked = r.label;
      });
      CMD_DANGER.forEach(function (r) {
        if (r.re.test(cmdText) && risks.indexOf(r.label) < 0) risks.push(r.label);
      });
    }

    /* ---- 写入路径检查 ---- */
    var pathField = j.path || j.file || j.target || "";
    var hit = inSysDir(pathField);
    if (hit) {
      risks.push("写入系统目录 " + hit);
      if (!base) { label = label || "写系统路径"; why = why || "改的是系统目录下的文件，可能让设备起不来。"; }
    }
    /* 命令里出现的系统路径也算（sed -i ... /etc/config/network 这种） */
    if (cmdText) {
      SYS_DIRS.forEach(function (d) {
        var re = new RegExp(d.replace(/\//g, "\\/") + "(\\/|\\s|$)");
        if (re.test(cmdText) && risks.join().indexOf(d) < 0)
          risks.push("涉及系统目录 " + d);
      });
    }

    /* shell 本身不是危险信号：ls / cat / ps 这类也会走 shell。
     * 只有命令内容命中危险模式、或碰了系统目录时才打扰用户。 */
    if (op === "shell" && !risks.length && !blocked) return null;

    /* ---- 决定要不要问 ---- */
    if (!base && !risks.length && !blocked) return null;

    /* 参数摘要：密码一律打码 */
    var parts = [];
    ["user", "path", "key", "value", "cmd", "package", "action"].forEach(function (k) {
      if (j[k] === undefined || j[k] === null) return;
      var v = String(j[k]);
      if (k === "value" && /pass|pwd|secret|token|key/i.test(String(j.key || ""))) v = "******";
      if (v.length > 80) v = v.slice(0, 77) + "...";
      parts.push(k + " = " + v);
    });

    return {
      op: op || "(无 op)",
      label: label || "危险操作",
      why: why || "这条操作会改动系统状态。",
      args: parts.join("\n"),
      risks: risks,
      blocked: blocked
    };
  }

  /* 弹确认框。onOk 只在用户点"确认执行"时调用 */
  function confirmDanger(info, onOk){
    var mask = document.createElement("div");
    mask.className = "qask-mask";
    mask.innerHTML =
      '<div class="qask-box dgr-box">' +
        '<div class="dgr-head">' + (info.blocked ? '⛔ 这个操作被拒绝' : '⚠ 这个操作需要你确认') + '</div>' +
        '<div class="dgr-op">' + esc(info.op) + (info.label ? ' · ' + esc(info.label) : '') + '</div>' +
        '<div class="dgr-why">' + esc(info.blocked ? ('命中禁止规则：' + info.blocked + '。这类操作不提供确认，直接拒绝。') : info.why) + '</div>' +
        (info.risks && info.risks.length
          ? '<div class="dgr-risks">' + info.risks.map(function (r) {
              return '<span class="dgr-tag">' + esc(r) + '</span>';
            }).join('') + '</div>'
          : '') +
        (info.args ? '<pre class="dgr-args">' + esc(info.args) + '</pre>' : '') +
        '<div class="qask-foot">' +
          (info.blocked
            ? '<button class="cancel">知道了</button>'
            : '<button class="cancel">取消，不执行</button><button class="dgr-ok">确认执行</button>') +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    if (name === "voice") renderVoiceModels();

    var close = function(){
      try { document.body.removeChild(mask); } catch (e) {}
      document.removeEventListener("keydown", onKey);
    };
    var onKey = function(ev){
      if (ev.key === "Escape") { close(); toast("已取消"); }
    };
    document.addEventListener("keydown", onKey);

    mask.addEventListener("click", function(ev){
      var t = ev.target;
      if (t.classList && t.classList.contains("dgr-ok")) {
        close();
        onOk();
        return;
      }
      if (t === mask || (t.classList && t.classList.contains("cancel"))) {
        close();
        toast("已取消，什么都没执行");
      }
    });
    /* 默认焦点给"取消"，回车不会误执行 */
    var c = mask.querySelector(".cancel");
    if (c) c.focus();
  }

  /* 用户确认后，把内部 confirm 补上（插件据此放行）。
   * 只有走过确认框的任务才会进这里，所以可以放心补。 */
  function withConfirm(task){
    try {
      var j = JSON.parse(String(task));
      var op = String(j.op || "").toLowerCase();
      if ((op === "passwd" || op === "reboot" || op === "shell") && !j.confirm) {
        j.confirm = "yes";
        return JSON.stringify(j);
      }
    } catch (e) {}
    return task;
  }


  /* 入口：高危操作先问用户，确认了才真的发 */
  function runAgent(task){
    var dg = dangerOf(task);
    if (!dg) { runAgentRaw(task); return; }
    if (dg.blocked) { confirmDanger(dg, function(){}); return; }   /* 只提示，不给执行 */
    confirmDanger(dg, function(){
      runAgentRaw(withConfirm(task), task);   /* 显示原文，发出去的是补了 confirm 的 */
    });
  }

  function runAgentRaw(task, shown){
    input.value = ""; autosize();
    addMsg("user", render(shown || task, false));
    /* agent 的 JSON 约束会掐死数学推理：实测同一个 3B，纯对话能算对
       （长宽比5:2对角线29 → 面积290），进 agent 模式只会瞎编式子。
       检测到纯计算类任务就先提醒，别让用户白等五分钟。 */
    if (/计算|算一下|求解|解方程|面积|周长|体积|比例.*求|多少平方|多少立方/.test(task)
        && !/文件|目录|磁盘|系统|PPT|幻灯片|音乐|MIDI|下载|网页|抓/.test(task)) {
      addMsg("bot", '<div class="awarn">这类计算/推理题在 Agent 模式下容易算错'
        + '（JSON 约束让它没有推理空间，实测同一道题对话模式能算对）。'
        + '建议切回「对话」模式问。任务仍会执行，但结果请自己核对。</div>');
    }
    /* agent 是独立会话，模型看不到页面上的对话。
       用户说"这段代码 / 上面那个 / 刚才的文件"时，把最近几轮当参考带上，
       否则它只能反问（页面是非交互的，反问等于失败）。 */
    var ref = uploadsRef();
    /* 只有【明确指代】才带上文。
     * 之前的关键词太宽（这个/那个/再来/下一个…），新问题里碰上一个就把
     * 上一轮问答整段塞进任务开头，3B 看到旧问题就照着答 —— 表现成"换了
     * 问题，回答里还是上一个问题"。
     * 现在要求：任务够短（<40 字，长任务自己说得清）且含强指代词。 */
    var STRONG_REF = /刚才|上次|上面那|上面的|上面那个|前面那|上一条|这条|刚生成|刚做的|那段|那段代码|这段代码|该代码|那个文件|这个文件|那个目录|这个目录|那里的|这里的|那首|那篇|接着上文|继续上面|照刚才|按刚才/;
    /* 光靠上面的强指代词就够精确了（"刚才""这个目录""那段代码"…），
     * 再卡首字反而把"刚才那个脚本再改一下"这种正常追问挡在外面。 */
    var isFollowup = task.length <= 40 && STRONG_REF.test(task) && history.length;
    if (isFollowup) {
      /* 只取上一轮，且压到 200 字以内：给多了小模型就分不清哪个是当前任务 */
      var ctx = history.slice(-2).map(function(m){
        var c = String(m.content || "").replace(/\s+/g, " ").slice(0, 200);
        return (m.role === "user" ? "用户: " : "回答: ") + c;
      }).join("\n");
      ref = "【上文仅供理解指代，不要回答其中的问题】\n" + ctx
          + "\n\n【当前任务（只做这个）】\n";
    }
    var bubble = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');
    bubble.classList.add("agent-bubble");
    setBusy(true);
    setTps("");

    fetch("/cgi-bin/agent", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({task: ref + task, max_steps: 5})
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || "启动失败");
        pollAgent(j.job, bubble, Date.now(), task);
      })
      .catch(function(e){
        bubble.innerHTML = '<span class="err">' + esc(e.message || "启动失败") + '</span>';
        setBusy(false);
      });
  }

  /* 启动自动化插件，两种方式：
   *   daemon=false  前台跑一遍：开气泡、日志实时刷、跑完结束（不常驻）
   *   daemon=true   后台守护：脱离会话常驻，面板显示运行中，随时可停
   * 默认参数用插件自己的（sysmon 前台会自动收敛成有限轮次）。 */
  function runAuto(name, daemon){
    var panel = document.getElementById('envpanel');
    if (panel) panel.classList.remove('show');
    var q = "/cgi-bin/agent?auto=" + encodeURIComponent(name) +
            (daemon ? "&daemon=1" : "") +
            "&args=" + encodeURIComponent("{}");

    if (daemon) {
      /* 后台：不建气泡，只需要一条 toast + 面板状态刷新 */
      fetch(q).then(function(r){ return r.json(); })
        .then(function(j){
          if (j.already) { toast(j.note || "已经在运行了", 4000); }
          else if (!j.ok) { throw new Error(j.error || "启动失败"); }
          else { toast("已在后台守护运行：" + name, 4000); }
          setTimeout(function(){ if (window.refreshEnv) window.refreshEnv(); }, 800);
        })
        .catch(function(e){ toast("启动失败：" + (e.message || ""), 5000); });
      return;
    }

    /* 前台：和普通任务一样的体验，日志实时显示 */
    var bubble = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');
    bubble.classList.add("agent-bubble");
    setBusy(true);
    setTps("");
    fetch(q).then(function(r){ return r.json(); })
      .then(function(j){
        if (j.already) {
          bubble.innerHTML = '<span class="warn">' + esc(j.note || "已经在运行了") + '</span>';
          setBusy(false);
          return;
        }
        if (!j.ok) throw new Error(j.error || "启动失败");
        pollAgent(j.job, bubble, Date.now(), "auto:" + name);
      })
      .catch(function(e){
        bubble.innerHTML = '<span class="err">' + esc(e.message || "启动失败") + '</span>';
        setBusy(false);
      });
  }

  /* 停止：给守护进程发 SIGTERM，插件在当前轮次结束后退出 */
  function stopAuto(name){
    fetch("/cgi-bin/agent?auto_stop=" + encodeURIComponent(name) + "&_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        toast(j.stopped ? ("已停止：" + name) : (j.note || "没在运行"), 4000);
        /* 状态交给 2 秒轮询去刷，不重建面板（重建会让滚动位置跳） */
      })
      .catch(function(e){ toast("停止失败：" + (e.message || ""), 5000); });
  }

  window.stopAuto = stopAuto;
  window.runAuto = runAuto;     /* 面板那块 <script> 是另一个作用域，得挂出来 */

  function pollAgent(job, bubble, t0, task){
    fetch("/cgi-bin/agent?job=" + encodeURIComponent(job) + "&_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok){
          bubble.innerHTML = '<span class="err">' + esc(j.error || "任务丢失") + '</span>';
          setBusy(false);
          return;
        }
        /* 任务刚提交时 output 还是空的，renderAgentLog("") 会渲染成
         * "（没有输出）" —— 明明在跑，看着像失败。运行中且没内容时给"思考中…"，
         * 真跑完了还是空的才显示"（没有输出）"。 */
        var outText = j.output || "";
        /* 注意：output 里一开始就有 "任务: xxx" 这种框架自己的行，
         * 原始字符串非空、但过滤后什么都不剩 —— 所以判空要按"过滤后"算，
         * 否则永远判不出"还没出东西"。 */
        var meaningful = outText.split("\n").filter(function(L){
          return L.trim() && !/^(已加载:|自动化:|跳过 |任务:|插件:|模型\()/.test(L);
        }).length > 0;
        var thinking = !j.done && !meaningful;
        /* 只要"最后一行"是【…】标记，就说明某一步刚开始、还没出结果。
         * 必须在 if 之前判断：否则标记会被当普通日志行渲染掉，
         * 用户看到的就是"没有切换到插件工作"。 */
        if (!j.done) {
          var allLines = String(outText).split("\n").filter(function(x){ return x.trim(); });
          var lastLn = allLines.length ? allLines[allLines.length - 1].trim() : "";
          if (/^【[^】]{2,44}】$/.test(lastLn)) thinking = true;
        }
        if (thinking) {
          /* 能在等的时候看出"现在是谁在干活"：agent 会打【插件 sys 开始工作】
           * 这种标记，直接拿它当状态文字，比一律"思考中…"有用得多。 */
          /* 分三种状态，让用户一眼看出"是模型慢还是插件慢"：
           *   【插件 sys 开始工作】 → 插件在跑
           *   【插件切换 doc → owrt】 → 选错插件、框架改投
           *   【模型 …】/没有标记     → 模型在推理                    */
          var mk = outText.match(/【([^】]{2,44})】/g);
          var hint = "模型推理中…", cls = "thinktxt";
          if (mk && mk.length) {
            var last = mk[mk.length - 1].replace(/[【】]/g, "");
            if (last.indexOf("插件") === 0) { hint = last; cls = "thinktxt plug"; }
            else if (last.indexOf("模型") === 0) { hint = last; cls = "thinktxt"; }
          }
          bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'
            + '<span class="' + cls + '">' + esc(hint) + '</span>';
        } else {
          bubble.innerHTML = renderAgentLog(outText);
        }
        /* 下载按钮：复制到记事本会因无 BOM 被按 GBK 解码而乱码，
           下载成带 BOM 的 .txt 就不会了 */
        if (!thinking && !bubble.querySelector(".dl")){
          var dl = document.createElement("button");
          dl.className = "dl";
          dl.textContent = "下载";
          dl.title = "下载为带 BOM 的 UTF-8 文本（记事本打开不乱码）";
          dl.onclick = function(){
            var txt = outText.replace(/^(任务:|模型:).*\n/gm, "");
            var blob = new Blob(["\ufeff" + txt],
                                {type: "text/plain;charset=utf-8"});
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "agent-" + job + ".txt";
            a.click();
            setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
          };
          bubble.appendChild(dl);
        }
        scrollDown(false);
        var secs = ((Date.now() - t0) / 1000).toFixed(0);
        setTps(j.done ? "完成 " + secs + "s" : "运行中 " + secs + "s");
        if (j.done){
          /* 把这次 agent 往来记进 history。agent 是独立会话（每次新进程），
             不记的话用户再说"继续"或"再来一个"时它完全没有上下文，
             实测会直接傻掉（或者瞎调工具）。 */
          var fin = (j.output || "").match(/最终回答:\s*([\s\S]*?)\n\[统计\]/);
          history.push({role: "user", content: "（Agent 任务）" + (task || "")});
          history.push({role: "assistant",
                        content: fin ? fin[1].trim() : "（已执行，详见步骤卡片）"});
          setBusy(false);
          return;
        }
        setTimeout(function(){ pollAgent(job, bubble, t0, task); }, 1500);
      })
      .catch(function(){
        setTimeout(function(){ pollAgent(job, bubble, t0, task); }, 3000);
      });
  }

  /* 从输入里估算这次要多少 token。
     中文 1 字 ≈ 1.6~2 token（Qwen2.5 分词），写死 1024 会让"500 字"的文章
     在半截被截断，而且模型自己不知道 —— 用户看到的就是"后面的字没了"。
     这里按用户点明的字数放大，上限 3072（ctx 8192 足够）。 */
  function wantTokens(txt){
    var s = String(txt || "");
    var chars = 0;
    var m = s.match(/(\d{2,5})\s*字/);
    if (m) chars = parseInt(m[1], 10) || 0;
    if (!chars){
      var cn = {"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
      var mm = s.match(/([一二两三四五六七八九])\s*([百千])\s*字/);
      if (mm) chars = cn[mm[1]] * (mm[2] === "百" ? 100 : 1000);
    }
    if (chars < 200) return 1024;
    return Math.min(3072, Math.round(chars * 2.0) + 200);
  }

  function send(){
    var text = input.value.trim();
    if (!text || busy) return;
    if (MODE === "agent"){ runAgent(text); return; }
    input.value = ""; autosize();
    history.push({role:"user", content:text});
    addMsg("user", render(text, false));

    var bubble = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');

    ctrl = new AbortController();
    setBusy(true);
    setTps("");

    var t0 = 0, nChunks = 0, acc = "", finishReason = "";
    var body = {
      messages: [{role:"system", content:SYSTEM}].concat(history.slice(-6)),
      stream: true, max_tokens: wantTokens(text), temperature: 0.7, top_p: 0.9,
      /* 0.5B 很容易把同一段代码复读十几遍，默认 repeat_penalty 是 1.0（不惩罚） */
      repeat_penalty: 1.15, repeat_last_n: 256, frequency_penalty: 0.3
    };

    fetch(API + "/v1/chat/completions", {
      method: "POST",
      headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify(body),
      signal: ctrl.signal
    }).then(function(resp){
      if (resp.status === 401) throw new Error("401");
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
      var reader = resp.body.getReader(), dec = new TextDecoder("utf-8"), buf = "";
      function pump(){
        return reader.read().then(function(r){
          if (r.done) return;
          buf += dec.decode(r.value, {stream:true});
          var lines = buf.split("\n");
          buf = lines.pop();
          for (var i = 0; i < lines.length; i++){
            var line = lines[i].trim();
            if (line.indexOf("data:") !== 0) continue;
            var payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            var j;
            try { j = JSON.parse(payload); } catch(e){ continue; }
            var d = j.choices && j.choices[0] && j.choices[0].delta;
            var fr = j.choices && j.choices[0] && j.choices[0].finish_reason;
            if (fr) finishReason = fr;
            var piece = (d && d.content) || "";
            if (piece){
              if (!t0) t0 = performance.now();
              acc += piece; nChunks++;
              bubble.innerHTML = render(acc, false, true) + '<span class="caret"></span>';
              scrollDown(false);
              if (nChunks % 10 === 0 && t0){
                var secs = (performance.now() - t0) / 1000;
                if (secs > 0.5) setTps((nChunks / secs).toFixed(1) + " t/s");
              }
            }
          }
          return pump();
        });
      }
      return pump();
    }).then(function(){
      finish(null);
    }).catch(function(e){
      if (e && e.name === "AbortError") { finish("__stop__"); return; }
      finish(e && e.message ? e.message : "请求失败");
    });

    function finish(err){
      setBusy(false);
      history.push({role:"assistant", content:acc});
      if (acc){
        bubble.innerHTML = render(acc, true);
      } else if (err === "401"){
        bubble.innerHTML = '<span style="color:#f85149">需要访问口令，点右上角钥匙图标输入</span>';
        askKey("服务开启了访问口令，请输入：");
      } else {
        bubble.innerHTML = '<span style="color:#f85149">' +
          (err === "__stop__" ? "已停止" : ("出错：" + err)) + '</span>';
      }
      if (t0 && nChunks){
        var s = (performance.now() - t0) / 1000;
        if (s > 0.5) setTps((acc.length / s).toFixed(1) + " 字/s");
      }
      /* finish_reason=length 表示被 max_tokens 截断（不是模型写完了）。
         以前这种情况静默发生，用户只会觉得"后面的字没了"。 */
      if (finishReason === "length"){
        toast("输出达到长度上限被截断，可以说「继续写」接着生成", 5000);
      }
      if (err && err !== "__stop__" && err !== "401"){
        toast(err === "HTTP 503" ? "模型还在加载，稍等再发" : ("请求失败：" + err), 4000);
      }
      ctrl = null;
      scrollDown(false);
      if (!busy) input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  /* 停止：既要 abort 前端轮询，也要**通知后端杀进程**。
     以前只 abort 自己，后端 agent 照跑、.running 一直占着，
     后面所有任务都被"已有任务在跑"挡掉（用户：卡死后停止按钮也没用）。 */
  stopBtn.addEventListener("click", function(){
    fetch("/cgi-bin/agent?stop_job=1&_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        toast(j.stopped ? "已停止" : "没有在跑的任务", 2500);
        setBusy(false);
      })
      .catch(function(){ toast("停止请求失败", 3000); });
    if (ctrl) ctrl.abort();
    stopBtn.hidden = true;
  });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });
  keyBtn.addEventListener("click", function(){
    if (askKey(storedKey() ? "修改访问口令（留空 = 清除）：" : "服务开通了口令就填这里（留空 = 不用）：")){
      probe._asked = 0; probe._warned = 0;
      probe();
    }
  });
  clearBtn.addEventListener("click", function(){
    if (busy && ctrl) ctrl.abort();
    history = [];
    chat.innerHTML = "";
    setTps("");
    var w = document.createElement("div");
    w.className = "welcome"; w.id = "welcome";
    w.innerHTML = '<h3>对话已清空</h3><span style="font-size:calc(14px * var(--fs))">接着问吧</span>';
    chat.appendChild(w);
    input.focus();
  });

  /* ===== 快捷问题：3 个，可自定义，localStorage 持久化 =====
     以前是写死在 HTML 里的，改一次要重刷固件。现在点标题就能改，
     存 localStorage，刷新/重开浏览器都还在。 */
  var QUICK_KEY = "llama_quick_asks";
  var QUICK_DEFAULT = [
    "用一句话解释什么是 NPU",
    "写个 shell 脚本统计日志里 404 的数量",
    "OpenWrt 和一般 Linux 有什么区别？"
  ];

  function loadQuick(){
    try {
      var v = JSON.parse(localStorage.getItem(QUICK_KEY) || "null");
      if (Array.isArray(v) && v.length === 3 &&
          v.every(function(x){ return typeof x === "string" && x.trim().length; }))
        return v;
    } catch (e) {}
    return QUICK_DEFAULT.slice();
  }

  function renderQuick(){
    var box = document.getElementById("quickChips");
    if (!box) return;
    box.innerHTML = loadQuick().map(function(q){
      return '<span class="chip">' + esc(q) + "</span>";
    }).join("");
  }

  /* 插件使用说明。放在前端而不是 C 里，是因为要写清"怎么用、有什么坑"，
     这类文字放后端会撑爆 prompt。desc 太短（26 字），点 ⓘ 看全的。 */
  /* 插件使用说明。每个操作都带：干什么（文字）+ 可直接复制的 JSON 命令。
     说明放前端而不是 C 里 —— 这些文字塞进 prompt 会把上下文撑爆，
     desc 那 26 个字给模型看就够了，详细用法只在用户点开时加载。 */
  var PLUG_HELP = {
    browser: {
      what: "用真实浏览器（chrome + selenium）打开网站，在登录态下操作页面，并把页面自己发出的请求头抓下来。很多站点的签名（X-Sign / X-Token）是 JS 现算的，逆向极难，让浏览器跑一遍再抄走是最省事的路子。跑完自动生成一份能独立运行的 Python 复现脚本。",
      ops: [
        {n: "probe", d: "只看不动：把页面上重要元素全探一遍。每个输入框/按钮都给 CSS 选择器、XPath、能不能点到（hit）、是不是靠 JS 事件绑定（jsOnly）、在哪个 iframe 里（frame）。JS 实现的按钮没有 href/onclick，用 XPath 按文字定位最稳。",
         c: '{"op":"probe","url":"https://x.com/login","wait":8}'},
        {n: "autologin", d: "自动找账号框和密码框 → 填 → 点登录 → 返回 cookie 和「到底登没登进去」的判据。密码错会立即停止不重试。",
         c: '{"op":"autologin","url":"https://x.com/login","user":"账号","pass":"密码"}'},

    video: {
      what: "视频处理。AI 去字幕（mode=npu）：在 RK3566 的 NPU 上跑 MI-GAN，逐帧把硬字幕抹掉并用真实画面重建（约 1 秒/帧，边跑边出进度）；另有纯色覆盖、裁切两种轻量模式。还能转竖屏、压体积、加特效水印、合并切片、抽帧做 GIF、检测黑屏与场景切换。长任务加 async:1 后台跑，用 job 查进度。编码走 rkmpp（VPU），缩放可走 scale_rkrga。",
      ops: [
        {n: "hw", d: "硬件能力探测（先看这个）。会告出 ffmpeg-rkrga 在不在、rkmpp 能不能用、scale_rkrga 有没有。", c: "{\"op\": \"hw\"}"},
        {n: "info", d: "看视频信息：编码/分辨率/帧率/时长/码率。", c: "{\"op\": \"video_info\", \"path\": \"/opt/mp4/01.mp4\"}"},

        {n: "audio", d: "提取音轨（mp3/wav/m4a/opus）、静音（mute:1）、调音量（volume:1.5）。", c: "{\"op\": \"audio\", \"path\": \"/opt/mp4/01.mp4\", \"format\": \"mp3\"}"},

        {n: "status", d: "查底层程序/模型在不在", c: '{"op":"status"}'}
      ],
      sample: '修复这张图片 /tmp/old.jpg，放大 4 倍',
      note: "上传图片后气泡里会出现「🪄 修复这张图（4 倍）」按钮，点一下就行；"
          + "也可以直接发命令。产物在 /tmp/llama_agent/gen/fix_*.png。"
          + "底层是 /usr/bin/imgup → /opt/realesrgan/sr_img（glibc 程序，走 /opt/glibc loader）。"
          + "RK3566 的 NPU 只能跑 int8，fp16 会退化成 CPU、慢到不可用。"
    },
    voice: {
      what: "文字转语音：中文 / 中英混读合成 MP3（离线、纯 CPU）。结果直接在气泡里给播放器和下载按钮。"
          + "两套模型自动选：纯中文走 matcha-zh-baker（22.05kHz，RTF 0.95，快）；"
          + "正文里英文占比 ≥8% 走 melo-tts zh_en 双语（44.1kHz，英文是真英语发音，RTF≈5，慢）。"
          + "长文本按标点分段合成再拼接，不会一次卡几分钟。首次调用要加载模型（约 20 秒），同文本命中缓存秒回。",
      ops: [
        {n: "tts", d: "把 text 念成 mp3。speed 0.5~2.0；bitrate 32k/64k/96k；lang 可强制 zh / zh-en",
         c: '{"op":"tts","text":"欢迎使用本地语音助手","speed":1.0,"bitrate":"64k"}'},
        {n: "tts（中英混读）", d: "不写 lang 也会自动判：英文占比够就切双语模型",
         c: '{"op":"tts","text":"我在用 GPU 训练模型，速度还行","lang":"zh-en"}'},
        {n: "tts（从文件读）", d: "正文太长不想塞进命令，就写进文件再指过去",
         c: '{"op":"tts","path":"/tmp/正文.txt"}'},
        {n: "probe", d: "查板上有没有装 tts-rk3566", c: '{"op":"probe"}'}
      ],
      sample: '念：今天天气不错，适合出门散步',
      note: "自然语言直连：以 念 / 朗读 / 读出来 / 用语音说 / 转成语音 开头，后面跟正文（不走模型，直连 voice）。"
          + "产出在 /tmp/llama_agent/gen/tts_<hash>.mp3；纯中文走 matcha，中英混读走双语模型；"
          + "双语模型慢（1 秒语音约 5 秒算），长文本已按标点分段。"
    }
  };

  /* ---- 语音模型管理面板（voice 说明里用） ----
   * 模型不进 ipk：包里只有 matcha（26MB 中文女声），
   * zh-en（双语）和 kokoro（男声）点按钮现下，走 ?plug=voice 直接调插件。 */
  function plugCall(reqObj){
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(reqObj))));
    return fetch('/cgi-bin/agent?plug=voice&req=' + encodeURIComponent(b64))
      .then(function(r){ return r.json(); });
  }
  function renderVoiceModels(rootId){
    var box = document.getElementById(rootId || 'vlmm');
    if (!box) return;
    plugCall({op:'models'}).then(function(d){
      if (!d || !d.models) { box.innerHTML = '<div class="dim">读取失败</div>'; return; }
      var h = '<table class="vlm"><tr><th>模型</th><th>说明</th><th>大小</th><th></th></tr>';
      d.models.forEach(function(m){
        h += '<tr><td><code>' + esc(m.name) + '</code></td>'
          +  '<td>' + esc(m.desc || '') + '</td>'
          +  '<td>' + (m.installed ? (m.mb + ' MB') : '未安装') + '</td><td>';
        if (!m.installed && m.name !== 'matcha')
          h += '<button type="button" class="vlmbtn" data-m="' + esc(m.name) + '">下载安装</button>';
        else if (m.name === 'matcha')
          h += '<span class="dim">内置</span>';
        else
          h += '<span class="dim">已装</span> '
             + '<button type="button" class="vlmbtn vlmrm" data-m="' + esc(m.name) + '">卸载</button>';
        h += '</td></tr>';
      });
      box.innerHTML = h + '</table><div class="vlmmsg dim"></div>';
      Array.prototype.forEach.call(box.querySelectorAll('.vlmbtn'), function(b){
        var nm = b.getAttribute('data-m');
        if (b.className.indexOf('vlmrm') >= 0) b.onclick = function(){ removeModel(nm); };
        else b.onclick = function(){ startModelInstall(nm); };
      });
    });
  }
  function removeModel(name){
    if (!window.confirm('确定卸载 ' + name + '？删掉后用到它会自动回退到 matcha 女声。')) return;
    var box = document.getElementById('vlmmSet') || document.getElementById('vlmm');
    var msg = box ? box.querySelector('.vlmmsg') : null;
    if (msg) msg.textContent = '正在卸载 ' + name + '…';
    plugCall({op:'model_remove', name:name}).then(function(d){
      if (msg) msg.textContent = (d && (d.answer || d.error)) || '完成';
      renderVoiceModels(box ? box.id : 'vlmm');
    });
  }
  function startModelInstall(name){
    var box = document.getElementById('vlmmSet') || document.getElementById('vlmm');
    var msg = box.querySelector('.vlmmsg');
    if (msg) msg.textContent = '正在启动下载…';
    plugCall({op:'model_install', name:name}).then(function(d){
      if (msg) msg.textContent = (d && d.answer) ? d.answer : '启动失败';
      var t = setInterval(function(){
        plugCall({op:'model_status', name:name}).then(function(st){
          if (!st) return;
          if (msg) msg.textContent = st.installed ? ('已安装 ' + st.mb + ' MB')
                     : ('安装中… ' + (st.log ? String(st.log).split('\n').slice(-1)[0] : ''));
          if (st.installed) { clearInterval(t); renderVoiceModels(box ? box.id : 'vlmm'); }
        });
      }, 4000);
    });
  }

  function showPlugHelp(name){
    var h = PLUG_HELP[name] || {
      what: "这个插件还没有写使用说明。",
      ops: [], sample: "", note: ""
    };
    var mask = document.createElement("div");
    mask.className = "qask-mask";
    /* 命令不能塞进 data-* 属性：esc() 只转 & < >，不转双引号，
     * JSON 里的 " 会把属性直接截断（实测只拿到一个 "{"）。
     * 改成数组 + 索引，命令原文留在 JS 里，跟 HTML 属性无关。 */
    var CMDS = [];
    var opsHtml = (h.ops || []).map(function(o){
      var nm = o.n || o[0] || "", ds = o.d || o[1] || "", cm = o.c || "";
      var btn = "";
      if (cm) {
        CMDS.push(cm);
        btn = '<button type="button" class="cpbtn" data-idx="'
              + (CMDS.length - 1) + '">复制</button>';
      }
      return '<div class="hlp-op">'
           +   '<div class="hlp-oph"><code>' + esc(nm) + "</code>"
           +     "<span>" + esc(ds) + "</span></div>"
           +   (cm
                 ? '<div class="hlp-cmdwrap"><pre class="hlp-cmd">' + esc(cm) + "</pre>"
                 + btn + "</div>"
                 : "")
           + "</div>";
    }).join("");
    var extra = "";
    if (name === "voice") extra = '<div class="hlp-label">语音模型（可选，按需下载）</div>'
        + '<div id="vlmm" class="vlmm">正在读取…</div>';
    mask.innerHTML =
      '<div class="qask-box hlp-box">' +
        "<h4>" + esc(name) + "</h4>" +
        (h.what ? '<div class="hlp-what">' + esc(h.what) + "</div>" : "") +
        (opsHtml
          ? '<div class="hlp-tip">下面的命令整段复制（含最外层的 { }），粘到聊天框发送就能用</div>'
            + '<div class="hlp-label">能做什么</div><div class="hlp-ops">' + opsHtml + "</div>"
          : "") +
        (h.sample ? '<div class="hlp-label">示例</div><pre class="hlp-code">' + esc(h.sample) + "</pre>" : "") +
        extra +
        (h.note ? '<div class="hlp-note">' + esc(h.note) + "</div>" : "") +
        '<div class="qask-foot"><button class="ok">知道了</button></div>' +
      "</div>";
    document.body.appendChild(mask);

    var close = function(){
      try { document.body.removeChild(mask); } catch (e) {}
      document.removeEventListener("keydown", onKey);
    };
    var onKey = function(ev){ if (ev.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    mask.addEventListener("click", function(ev){
      var t = ev.target;
      /* 复制按钮：http 下 navigator.clipboard 不可用，用 textarea + execCommand 兜底 */
      if (t.classList && t.classList.contains("cpbtn")) {
        var idx = parseInt(t.getAttribute("data-idx"), 10);
        var cmd = (idx >= 0 && CMDS[idx]) ? CMDS[idx] : "";
        var done = function(){
          t.textContent = "已复制";
          setTimeout(function(){ t.textContent = "复制"; }, 1400);
        };
        var legacy = function(){
          var ta = document.createElement("textarea");
          ta.value = cmd;
          ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try { document.execCommand("copy"); done(); }
          catch (e2) { t.textContent = "复制失败"; }
          document.body.removeChild(ta);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(cmd).then(done, legacy);
          } else { legacy(); }
        } catch (e3) { legacy(); }
        return;
      }
      if (t === mask || (t.classList && t.classList.contains("ok"))) close();
    });
  }

  function editQuick(){
    var arr = loadQuick();
    var mask = document.createElement("div");
    mask.className = "qask-mask";
    mask.innerHTML =
      '<div class="qask-box set-box">' +
        "<h4>设置</h4>" +
        '<div class="stabbar">' +
          '<button type="button" class="stab active" data-t="q">快捷问题</button>' +
          '<button type="button" class="stab" data-t="p">插件</button>' +
          '<button type="button" class="stab" data-t="v">语音模型</button>' +
        "</div>" +
        '<div class="stabpane active" data-pane="q">' +
          '<p class="stip">固定 3 个，点一下输入框上方的快捷按钮就能直接问</p>' +
          arr.map(function(q, i){
            return '<label>问题 ' + (i+1) + '</label>' +
                   '<input class="qask-in" data-i="' + i + '" value="' + esc(q) + '">';
          }).join("") +
        "</div>" +
        '<div class="stabpane" data-pane="p">' +
          '<div class="plugtip">关掉的插件不加载 —— 工具表更短，模型选得更准、每步也更快；点「说明」看每个插件怎么用</div>' +
          '<input id="plugsearch" class="qask-in" style="margin:0 0 8px" placeholder="搜插件名或功能，例如 语音 / 表格 / midi">' +
          '<div id="pluglist">读取中…</div>' +
        "</div>" +
        '<div class="stabpane" data-pane="v">' +
          '<div class="plugtip">包里只带 matcha（中文女声 41MB）。中英双语和 kokoro 男声按需下载，装完自动清理冗余，不用了可以卸载回收空间</div>' +
          '<div id="vlmmSet" class="vlmm">读取中…</div>' +
        "</div>" +
        '<div class="qask-foot">' +
          '<span class="ver">htm 3.1.115</span>' +
          '<button class="cancel">取消</button>' +
          '<button class="ok">保存</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(mask);
    /* 三个分页：快捷问题 / 插件 / 语音模型，同一时间只显示一个 */
    (function(){
      var bar = mask.querySelector(".stabbar");
      if (!bar) return;
      bar.addEventListener("click", function(ev){
        var b = ev.target.closest(".stab");
        if (!b) return;
        var t = b.getAttribute("data-t");
        Array.prototype.forEach.call(mask.querySelectorAll(".stab"), function(x){
          x.classList.toggle("active", x === b);
        });
        Array.prototype.forEach.call(mask.querySelectorAll(".stabpane"), function(pn){
          pn.classList.toggle("active", pn.getAttribute("data-pane") === t);
        });
        if (t === "v") renderVoiceModels("vlmmSet");
      });
    })();
    renderVoiceModels('vlmmSet');

    /* 拉一次环境信息，把插件列出来（勾选=启用） */
    (function(){
      var pl = mask.querySelector("#pluglist");
      fetch("/cgi-bin/agent?env=1").then(function(r){ return r.json(); }).then(function(j){
        var e = (j && j.env) || {};
        var tools = (e.plugins || []).filter(function(p){ return (p.kind || "tool") === "tool"; });
        var off = e.disabled || [];
        /* 被停用的插件 agent 压根没加载，env 里不会出现 —— 手动补进列表，
         * 否则页面上看不到它们，也就没法重新打开。 */
        off.forEach(function(n){
          var found = false;
          for (var q = 0; q < tools.length; q++) if (tools[q].name === n) { found = true; break; }
          if (!found) tools.push({ name: n, desc: "当前停用（未加载）", kind: "tool" });
        });
        if (!tools.length) { pl.textContent = "没取到插件列表"; return; }
        var si = mask.querySelector("#plugsearch");
        var applyFilter = function(){
          var kw = (si && si.value || "").trim().toLowerCase();
          Array.prototype.forEach.call(pl.querySelectorAll(".plugrow, .plug-item, .plg"), function(r){
            r.style.display = (!kw || (r.textContent || "").toLowerCase().indexOf(kw) >= 0) ? "" : "none";
          });
        };
        if (si) si.addEventListener("input", applyFilter);
        /* 启用的排前面，停用的排后面并置灰，一眼能看出关了什么 */
        tools.sort(function(a, b){
          var ao = off.indexOf(a.name) >= 0 ? 1 : 0;
          var bo = off.indexOf(b.name) >= 0 ? 1 : 0;
          return ao - bo || (a.name < b.name ? -1 : 1);
        });
        pl.innerHTML = tools.map(function(p){
          var on = off.indexOf(p.name) < 0;
          /* 结构说明（改过一版，踩了坑）：
           *   原来整行是 <label>，「说明」按钮也在里面 —— 点它浏览器会连带
           *   激活 label 里的 checkbox，把插件关掉。preventDefault 拦不住
           *   label 的默认激活行为。
           *   现在整行是 <div>，「说明」是独立的 <i>，插件名单独用
           *   <label for=checkbox> —— 点名字还是能勾选，点「说明」不会。 */
          var cbId = "cb_" + String(p.name).replace(/[^A-Za-z0-9_-]/g, "_");
          return '<div class="plugrow' + (on ? "" : " off") + '" title="' + esc(p.desc || "") + '">' +
                   '<input type="checkbox" data-p="' + esc(p.name) + '" id="' + cbId + '"' +
                     (on ? " checked" : "") + ">" +
                   '<i class="ph" data-help="' + esc(p.name) + '" title="看这个插件怎么用">说明</i>' +
                   '<label class="plname" for="' + cbId + '" title="点一下勾选/取消">' +
                     esc(p.name) + "</label>" +
                   '<span>' + esc((p.desc || "").slice(0, 26)) + "</span>" +
                 "</div>";
        }).join("");
        /* 点 ⓘ 看详细说明。它在 <label> 里面，默认点击会连带 toggle 掉 checkbox，
         * 所以必须 preventDefault + stopPropagation，而且要用捕获阶段抢在
         * label 的默认行为之前。 */
        pl.addEventListener("click", function(ev){
          var t = ev.target;
          var nm = t && t.getAttribute && t.getAttribute("data-help");
          if (nm) {
            ev.preventDefault();
            ev.stopPropagation();
            showPlugHelp(nm);
            return;
          }
          /* 整行可点：原来只有勾选框和插件名能切换，点描述文字/行空白毫无反应，
           * 用户以为"关掉了"其实没勾上，保存时 collected 为空 → {"disabled":0}。
           * 这里把行内任意位置（说明按钮已提前 return）都转成一次勾选切换。 */
          var row = t && t.closest ? t.closest(".plugrow") : null;
          if (row && t.tagName !== "INPUT" && t.tagName !== "LABEL") {
            var cb = row.querySelector("input[data-p]");
            if (cb) {
              cb.checked = !cb.checked;
              row.classList.toggle("off", !cb.checked);
              updateTip();
            }
          }
        }, true);
        /* 勾选状态一变就更新置灰样式 */
        pl.addEventListener("change", function(ev){
          var t = ev.target;
          if (t && t.type === "checkbox") {
            t.parentNode.classList.toggle("off", !t.checked);
            updateTip();
          }
        });

        function updateTip(){
          var nOff = 0;
          var cbs = pl.querySelectorAll("input[data-p]");
          for (var q = 0; q < cbs.length; q++) if (!cbs[q].checked) nOff++;
          var tip = mask.querySelector(".plugtip");
          if (tip) tip.textContent = "共 " + cbs.length + " 个插件" +
            (nOff ? "，" + nOff + " 个已停用" : "") +
            "。关掉的插件不加载 —— 工具表更短，模型选得更准、每步也更快";
        }
        updateTip();
      }).catch(function(){ pl.textContent = "取不到环境信息"; });
    })();

    var ins = mask.querySelectorAll(".qask-in");
    if (ins.length) { ins[0].focus(); ins[0].select(); }

    function close(){ mask.remove(); }
    mask.querySelector(".cancel").addEventListener("click", close);
    mask.addEventListener("click", function(e){ if (e.target === mask) close(); });
    mask.querySelector(".ok").addEventListener("click", function(){
      var out = [];
      for (var i = 0; i < ins.length; i++){
        var v = ins[i].value.trim();
        out.push(v || QUICK_DEFAULT[i]);      /* 空着就用默认值补上，永远保持 3 个 */
      }
      localStorage.setItem(QUICK_KEY, JSON.stringify(out));
      renderQuick();

      /* 插件开关写到后端（/etc/llama.plugoff），下次任务就不加载被关掉的插件 */
      var offs = [];
      var cbs = mask.querySelectorAll("#pluglist input[data-p]");
      for (var k = 0; k < cbs.length; k++)
        if (!cbs[k].checked) offs.push(cbs[k].getAttribute("data-p"));
      fetch("/cgi-bin/agent?set_plugoff=" +
              offs.map(encodeURIComponent).join(","))   /* 逗号要留作分隔符 */
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (j && !j.ok) alert("插件开关保存失败：" + (j.error || ""));
        })
        .catch(function(){});
      close();
    });
    mask.addEventListener("keydown", function(e){
      if (e.key === "Escape") close();
      if (e.key === "Enter") mask.querySelector(".ok").click();
    });
  }

  /* chips 是动态渲染的，用事件委托绑一次 */
  var chipsBox = document.getElementById("quickChips");
  if (chipsBox) chipsBox.addEventListener("click", function(e){
    var c = e.target.closest ? e.target.closest(".chip") : null;
    if (!c) return;
    input.value = c.textContent;
    autosize();
    input.focus();
  });

  var heroTitle = document.getElementById("heroTitle");
  if (heroTitle) heroTitle.addEventListener("click", editQuick);
  renderQuick();

  /* 旧的静态绑定（.chip 现在由上面委托处理，这里保留兼容其他地方的 chip） */
  Array.prototype.forEach.call(document.querySelectorAll(".astep .chip"), function(c){
    c.addEventListener("click", function(){
      input.value = c.textContent;
      autosize();
      input.focus();
    });
  });

  autosize();
  loadConf().then(function(ok){ if (ok) probe(); });
  input.focus();
})();
</script>
<script>
/* 顶部「环境与插件」按钮：点开看环境能力和已加载插件 */
(function(){
  var btn = document.getElementById('envbtn');
  var panel = document.getElementById('envpanel');
  if (!btn || !panel) return;

  /* 这个 <script> 和主脚本是不同作用域，主脚本里的 esc() 在这里看不到，
   * 之前直接用就抛 ReferenceError，被下面的 .catch 吞掉，
   * 现象是"环境两组能显示、插件列表却空白"。这里补一份自己的。 */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* 一组 chip：cls=rt（底层运行时，蓝）/ lib（专用库，紫），缺失=灰 */
  function chips(map, cls){
    var keys = Object.keys(map || {});
    if (!keys.length) return '<span class="grp">（无）</span>';
    var h = '';
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      h += '<span class="chip ' + cls + (map[k] ? '' : ' off') + '"><i></i>' + k + '</span>';
    }
    return h;
  }

  function render(e){
    document.getElementById('envrts').innerHTML = chips(e.runtimes, 'rt');
    document.getElementById('envlibs').innerHTML = chips(e.libs, 'lib');

    var ps = e.plugins || [];
    var box = document.getElementById('envplugs');
    if (!ps.length) {
      box.innerHTML = '<div class="pitem"><b>（无）</b><span>plugins/ 目录里没有 .so</span></div>';
      return;
    }
    var ph = '';
    var nTool = 0, nAuto = 0;
    for (var j = 0; j < ps.length; j++) {
      var p = ps[j];
      var isAuto = (p.kind === 'auto');
      if (isAuto) nAuto++; else nTool++;
      ph += '<div class="pitem' + (isAuto ? ' auto' : '') + '"'
          + (isAuto ? ' data-key="' + esc(p.name) + '"' : '') + '>'
          + '<b>' + esc(p.name) + '</b>'
          + '<span class="pill">' + (isAuto ? '自动化' : '工具') + '</span>';
      if (isAuto && p.triggers) ph += '<span class="trg">' + esc(p.triggers) + '</span>';
      ph += '<span>' + esc(p.desc || '') + '</span>';
      if (isAuto) {
        var running = p.running ? 1 : 0;
        ph += '<div class="astate ' + (running ? 'on' : 'off') + '">'
            + (running ? '● 运行中' + (p.pid ? ' (pid ' + p.pid + ')' : '') : '○ 已停止')
            + '</div>';
        if (running) {
          ph += '<button class="autoact stop" data-name="' + esc(p.name) + '"'
              + ' data-act="stop">停止</button>';
        } else {
          /* 两种运行方式：
           *   运行 = 前台跑一遍，日志实时刷在对话区，跑完就结束
           *   守护 = 后台常驻，面板显示运行中，随时可停 */
          ph += '<button class="autoact" data-name="' + esc(p.name) + '"'
              + ' data-act="run">运行</button>';
          ph += '<button class="autoact bg" data-name="' + esc(p.name) + '"'
              + ' data-act="bg">守护</button>';
        }
      }
      ph += '</div>';
    }
    box.innerHTML = ph;
    /* 点"运行"启动自动化流程，复用任务日志轮询 */
    box.onclick = function(ev){
      var b = ev.target.closest ? ev.target.closest('.autoact') : null;
      if (!b) return;
      ev.stopPropagation();
      var nm = b.getAttribute('data-name');
      var act = b.getAttribute('data-act');
      if (act === 'stop') {
        if (window.stopAuto) window.stopAuto(nm);
      } else if (act === 'bg') {
        if (window.runAuto) window.runAuto(nm, true);    /* 后台守护 */
      } else {
        if (window.runAuto) window.runAuto(nm, false);   /* 前台跑一遍 */
      }
      /* 状态要刷一下，不然按钮文字还是旧的 */
      setTimeout(function(){ if (window.refreshEnv) window.refreshEnv(); }, 1200);
    };
  }

  /* ---- 自动化状态实时刷新 ----
     面板开着的时候每 2 秒拉一次轻量状态（几十字节），只改状态文字和按钮，
     不重建面板 —— 否则滚动位置会跳、按钮会闪。 */
  var autoTimer = null;

  function paintAutoState(name, running, pid){
    var item = document.querySelector('#envplugs .pitem.auto[data-key="' + name + '"]');
    if (!item) return;
    var st = item.querySelector('.astate');
    if (st) {
      st.className = 'astate ' + (running ? 'on' : 'off');
      st.textContent = running
        ? ('● 运行中' + (pid ? ' (pid ' + pid + ')' : ''))
        : '○ 已停止';
    }
    var btn = item.querySelector('.autoact');
    var showingStop = btn && btn.getAttribute('data-act') === 'stop';
    if (showingStop !== !!running) {          /* 状态变了才重建按钮，避免闪烁 */
      var olds = item.querySelectorAll('.autoact');
      for (var k = 0; k < olds.length; k++) olds[k].parentNode.removeChild(olds[k]);
      if (running) {
        item.insertAdjacentHTML('beforeend',
          '<button class="autoact stop" data-name="' + name + '" data-act="stop">停止</button>');
      } else {
        item.insertAdjacentHTML('beforeend',
          '<button class="autoact" data-name="' + name + '" data-act="run">运行</button>'
          + '<button class="autoact bg" data-name="' + name + '" data-act="bg">守护</button>');
      }
    }
  }

  function pollAutoState(){
    var panel = document.getElementById('envpanel');
    if (!panel || !panel.classList.contains('show')) { stopAutoPoll(); return; }
    if (document.hidden) return;              /* 页面在后台就别刷了 */
    fetch('cgi-bin/agent?auto_state=1&_=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        (j.auto || []).forEach(function(a){ paintAutoState(a.name, a.running, a.pid); });
      })
      .catch(function(){ /* 网络抖动忽略，下次再刷 */ });
  }

  function startAutoPoll(){
    if (autoTimer) return;
    autoTimer = setInterval(pollAutoState, 2000);
    pollAutoState();
  }

  function stopAutoPoll(){
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  /* 面板显示/隐藏自动接管轮询：开就刷，关就停，不用在每个关闭分支里手动调 */
  if (window.MutationObserver) {
    new MutationObserver(function(){
      if (panel.classList.contains('show')) startAutoPoll();
      else stopAutoPoll();
    }).observe(panel, {attributes: true, attributeFilter: ['class']});
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) pollAutoState();
  });

  window.refreshEnv = load;

  function load(){
    fetch('cgi-bin/agent?env=1', {cache: 'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ render((d && d.env) || {}); })
      .catch(function(){});
  }

  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open = panel.classList.toggle('show');
    if (open) load();
  });
  document.addEventListener('click', function(ev){
    if (!panel.contains(ev.target) && !btn.contains(ev.target)) {
      panel.classList.remove('show');
    }
  });
  /* 不在这里 load()：页面刷新时不该去探环境（探库要跑子进程，
   * 每刷新一次就烧几秒 CPU）。只在点开面板那一刻查。 */
})();
</script>
<script>
/* 左上角忙闲（问 CGI ?status=1，判据和提交任务时的互斥判断一致，
 * 所以不会出现"显示空闲但提交被拒"） */
(function(){
  var el = document.getElementById('stat');
  if (!el) return;
  function setState(cls, text){
    el.className = 'stat ' + cls;
    el.textContent = text;
  }
  var missCnt = 0;
  function tick(){
    /* 绝对路径：嵌在 LuCI iframe 里或页面被放到子路径时，相对路径会 404 */
    fetch('/cgi-bin/agent?status=1&_=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) { missCnt++; setState('unknown', '（未知）'); return; }
        missCnt = 0;
        if (d.busy) setState('busy', '（忙碌）');
        else setState('idle', '（空闲）');
      })
      .catch(function(){
        missCnt++;
        /* 偶发一次失败不要立刻翻成"未知"，连续 3 次才报 */
        if (missCnt >= 3) setState('unknown', '（未知）');
      });
  }
  setState('unknown', '（检测中）');
  tick();
  (function loop(){
    setTimeout(function(){ tick(); loop(); },
      (el.className.indexOf('busy') >= 0) ? 1500 : 3000);
  })();
})();
</script>
</body>
