<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#0d1117">
<title>本地 AI 助手</title>
<style>
  :root{
    /* 整体提亮 + 提高对比：原来的 #0b0f14 太黑、#8b96a5 太灰，长时间看很累 */
    --bg:#161c25; --bg2:#191f28; --panel:#232b35; --panel2:#2c3541;
    --border:#3a4553; --border2:#414c5e;
    --text:#eef3fa; --dim:#bcc7d6; --dim2:#96a2b2;
    --accent:#5aa9ff; --accent2:#3d8ae8; --accent-soft:rgba(90,169,255,.16);
    --ok:#4ecb62; --warn:#e0a92f; --err:#ff6b63;
    --radius:14px;
    /* 全站字号系数：1=标准 1.1=大 1.22=特大。所有 font-size 都乘它，
       这样右上角那个 A 按钮才真的能整体放大，而不是只变标题。 */
    --fs:1.06;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:
    radial-gradient(1200px 600px at 50% -20%, #1c2939 0%, transparent 55%), var(--bg);
    color:var(--text);
    font-size:calc(16.5px * var(--fs));line-height:1.8;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;border-bottom:1px solid var(--border);
    background:rgba(21,27,35,.86);backdrop-filter:blur(12px);
    position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px;font-size:calc(16px * var(--fs))}
  /* 左上角忙闲状态（问 CGI ?status=1，判据与提交互斥一致） */
.stat{font-size:calc(12.5px * var(--fs));color:#9aa7b6;margin-left:6px;letter-spacing:.2px}
.stat.busy{color:#fbbf24}
.stat.idle{color:#4ade80}
.stat.unknown{color:#94a1b0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim2);flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(95,107,122,.16);transition:.3s}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.18)}
  .dot.load{background:var(--warn);box-shadow:0 0 0 3px rgba(210,153,34,.18);animation:pulse 1.3s infinite}
  .dot.err{background:var(--err);box-shadow:0 0 0 3px rgba(248,81,73,.18)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .meta{display:flex;align-items:center;gap:8px;font-size:calc(13px * var(--fs));color:var(--dim)}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--border);color:var(--dim);font-size:calc(13px * var(--fs));
    max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag b{color:var(--text);font-weight:500}
  .ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
    border-radius:9px;background:var(--panel2);border:1px solid var(--border);color:var(--dim);
    cursor:pointer;transition:.16s}
  .ibtn:hover{background:#212a35;border-color:var(--border2);color:var(--text)}
  .ibtn:active{transform:scale(.94)}
  .ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}

  /* 不要用 scroll-behavior:smooth：agent 每 1.5s 轮询更新，
     平滑滚动动画会被一次次打断，永远滚不到底（表现为"锁在顶部"） */
  main{flex:1;overflow-y:auto;padding:22px 18px 10px}
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:#2a3542;border-radius:4px}
  main::-webkit-scrollbar-track{background:transparent}

  .msg{display:flex;margin-bottom:18px;gap:11px;align-items:flex-start;
    animation:rise .28s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .who{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;
    font-size:calc(13.5px * var(--fs));font-weight:700;background:var(--panel2);border:1px solid var(--border);
    color:var(--dim)}
  .msg.user{flex-direction:row-reverse}
  .msg.user .who{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;color:#fff}
  /* AI 头像可点：打开设置 */
  .msg .who-ai{cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .msg .who-ai:hover{border-color:var(--accent);color:var(--accent);
    background:rgba(124,196,255,.12)}
  .bubble{max-width:min(82%,680px);padding:14px 18px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);white-space:pre-wrap;
    line-height:1.85;word-break:break-word;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.22)}
  .msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;color:#fff;border-bottom-right-radius:5px;
    box-shadow:0 2px 10px rgba(47,127,224,.22)}
  /* 字号三档：标准 / 大 / 特大。用 body class 覆盖关键字号，
     比全站 calc() 简单可靠；选择存 localStorage。 */
  /* 三档字号只改一个系数，其它全跟着走 */
  body.fs-lg{--fs:1.16}
  body.fs-xl{--fs:1.3}
  body.fs-xl .astep-h code,body.fs-xl .chip,body.fs-xl .secs{font-size:calc(15.5px * var(--fs))}
  body.fs-xl .astat{font-size:calc(15px * var(--fs))}
  /* 深色滚动条：默认的白色滚动条在深色主题上非常扎眼 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a3644;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#3c4c60}
  .msg.user .bubble{max-height:180px;overflow-y:auto}
  /* AI 气泡给个下限：纯 fit-content 时短内容会缩成一条，代码块/表格就挤扁了 */
  .msg.bot .bubble{border-bottom-left-radius:5px;min-width:min(380px,86%)}
  .bubble code{background:#0a0e13;border:1px solid var(--border);border-radius:5px;
    padding:1.5px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
  .bubble pre{position:relative;background:#0a0e13;border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;overflow-x:auto;margin:9px 0}
  .bubble pre code{background:none;border:0;padding:0;font-size:.87em;line-height:1.55}
  /* markdown 元素样式（表格/列表/标题/引用），之前只有裸文本 */
  .bubble table{border-collapse:collapse;margin:10px 0;font-size:calc(15px * var(--fs))}
  .bubble th,.bubble td{border:1px solid var(--border);padding:5px 10px;text-align:left}
  .bubble th{background:rgba(255,255,255,.055);font-weight:650;color:var(--text)}
  .bubble tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
  .bubble ul,.bubble ol{margin:8px 0;padding-left:23px}
  .bubble li{margin:3.5px 0}
  .bubble h3,.bubble h4,.bubble h5,.bubble h6{margin:11px 0 6px;
    font-size:calc(16px * var(--fs));font-weight:650;color:var(--text);line-height:1.4}
  .bubble blockquote{margin:9px 0;padding:7px 13px;border-left:3px solid var(--border2);
    color:var(--dim);background:rgba(255,255,255,.022);border-radius:0 7px 7px 0}
  .bubble i{color:#c8d4e0}
  /* 代码高亮配色（One Dark 系） */
  .c-kw{color:#ff7ab2}                    /* 关键字 */
  .c-st{color:#a8e07a}                    /* 字符串 */
  .c-cm{color:#8e9aa9;font-style:italic}  /* 注释 */
  .bubble pre .copy{position:absolute;top:6px;right:6px;font-size:calc(12.5px * var(--fs));padding:3px 8px;
    border-radius:6px;background:#1b222c;border:1px solid var(--border2);color:var(--dim);
    cursor:pointer;opacity:0;transition:.15s}
  .bubble pre:hover .copy{opacity:1}
  .bubble pre .copy:hover{color:var(--accent);border-color:var(--accent)}
  .bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
  .bubble li{margin:3px 0}
  .caret{display:inline-block;width:7px;height:15px;vertical-align:-2px;
    background:var(--accent);animation:blink 1s steps(2) infinite;border-radius:1px}
  @keyframes blink{50%{opacity:0}}

  .thinktxt.plug{color:#6cd0a8;font-weight:600}
  .thinktxt{font-size:calc(13.5px * var(--fs));color:var(--dim);margin-left:8px;letter-spacing:.5px}
  .typing{display:inline-flex;gap:4px;align-items:center;height:20px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35;
    animation:dip 1.15s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes dip{0%,80%,100%{opacity:.28;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  .welcome{text-align:center;padding:46px 12px 24px;color:var(--dim);font-size:calc(14.5px * var(--fs))}
  .welcome .logo{width:56px;height:56px;margin:0 auto 16px;border-radius:17px;
    background:linear-gradient(140deg,rgba(74,158,255,.22),rgba(47,127,224,.06));
    border:1px solid rgba(74,158,255,.3);display:grid;place-items:center}
  .welcome .logo svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .welcome h3{margin:0 0 7px;font-size:calc(19px * var(--fs));font-weight:650;color:var(--text);
    background:linear-gradient(90deg,#e8eef6,#9dc4ee);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #heroTitle{cursor:pointer;transition:color .15s}
  #heroTitle:hover{color:#68e6b4}
  #heroTitle .pencil{font-size:.62em;opacity:0;margin-left:7px;
    color:#68e6b4;vertical-align:super;transition:opacity .15s}
  #heroTitle:hover .pencil{opacity:.9}
  .qask-mask{position:fixed;inset:0;background:rgba(3,8,12,.72);
    display:flex;align-items:center;justify-content:center;z-index:200;
    backdrop-filter:blur(3px)}
  .qask-box{width:min(560px,92vw);background:var(--panel);
    border:1px solid var(--border);border-radius:13px;padding:20px 22px;
    max-height:88vh;overflow-y:auto;
    box-shadow:0 18px 48px rgba(0,0,0,.55)}
  .qask-box h4{margin:0 0 8px;font-size:calc(17px * var(--fs));color:var(--text)}
  .qask-box p{margin:0 0 14px;font-size:calc(13.5px * var(--fs));color:var(--dim)}
  /* 设置弹窗里的插件开关区块 */
  .plugsec{margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .plughead{font-size:calc(14px * var(--fs));color:var(--text);margin-bottom:4px;font-weight:600}
  /* 插件名也可点开说明，比只有一个小圆圈更容易发现 */
  .pk-hint{font-weight:400;font-size:calc(12.5px * var(--fs));color:#a3aebb;margin-left:9px;letter-spacing:0}
  /* 弹窗底部的版本标记 —— 用来一眼确认浏览器加载的是新版而不是缓存 */
  .ver{font-size:calc(12.5px * var(--fs));color:#8e9aa9;margin-right:auto;letter-spacing:.02em}
  .plugtip{font-size:calc(13px * var(--fs));color:var(--dim);margin:0 0 10px;line-height:1.5}
  /* 单列：两列时插件名和描述会挤在一起 */
  #pluglist{max-height:264px;overflow-y:auto;display:flex;flex-direction:column;gap:0;
            border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:3px}
  .plugrow{display:flex;align-items:center;gap:8px;padding:4px 8px;
           cursor:pointer;font-size:calc(13px * var(--fs));border-radius:5px}
  .plugrow:hover{background:rgba(255,255,255,.05)}
  .plugrow input{margin:0;flex:none;cursor:pointer}
  /* .qask-box input 是给文本框用的（width:100%），会把 checkbox 撑满整行 */
  .plugrow input[type=checkbox]{width:15px;height:15px;padding:0;
                                accent-color:var(--accent);flex:none}
  .plugrow .plname{font-weight:600;color:var(--text);flex:none;min-width:56px;
                   margin-right:8px;cursor:pointer;user-select:none}
  .plugrow .plname:hover{color:#7cc4ff;text-decoration:underline dotted}
  .plugrow span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;
                white-space:nowrap;flex:1;min-width:0;font-size:calc(13px * var(--fs))}
  .plugrow.off{opacity:.45}
  .plugrow.off .plname{text-decoration:line-through}
  .qask-box label{display:block;font-size:calc(13.5px * var(--fs));color:var(--dim);margin:9px 0 4px}
  .qask-box input{width:100%;box-sizing:border-box;padding:8px 11px;
    background:#0b1418;border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-size:calc(14.5px * var(--fs));font-family:inherit}
  .qask-box input:focus{outline:none;border-color:#34d399}
  .qask-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}
  .qask-foot button{padding:7px 17px;border-radius:7px;font-size:calc(14px * var(--fs));
    cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
  .qask-foot .ok{background:linear-gradient(135deg,#34d399,#0ea371);
    color:#052e1f;border:none;font-weight:600}
  .chips{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{padding:8px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:calc(13.5px * var(--fs));cursor:pointer;transition:.16s;text-align:left;max-width:100%}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .chip:active{transform:none}

  footer{display:flex;gap:9px;align-items:flex-end;padding:11px 18px 14px;
    border-top:1px solid var(--border);background:rgba(21,27,35,.92);
    backdrop-filter:blur(12px);position:sticky;bottom:0;
    padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .inputwrap{flex:1;position:relative;display:flex;align-items:flex-end;gap:8px}
  .inputwrap > #upbtn, .inputwrap > #setbtn{flex:none;width:42px;height:42px;margin-bottom:3px}
  #input{flex:1;resize:none;max-height:160px;min-height:48px;padding:13px 16px;
    border-radius:13px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);font:inherit;outline:none;transition:.18s;line-height:1.5;
    overflow-y:auto}
  #input::placeholder{color:var(--dim2)}
  #input:focus{border-color:rgba(74,158,255,.55);background:#0f151c;
    box-shadow:0 0 0 3px rgba(74,158,255,.1)}
  #send,#stop{border:0;border-radius:13px;font-weight:650;font-size:calc(15px * var(--fs));cursor:pointer;
    color:#fff;transition:.16s;flex:0 0 auto;height:44px;padding:0 20px;
    display:inline-flex;align-items:center;gap:6px}
  #send svg,#stop svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  #send{background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 2px 12px rgba(47,127,224,.3)}
  #send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  #send:active:not(:disabled){transform:scale(.97)}
  #stop{background:linear-gradient(135deg,#f85149,#cf3030)}

  .hint{padding:0 18px 7px;font-size:calc(12.5px * var(--fs));color:var(--dim2);text-align:center;letter-spacing:.3px}

  #scrollBtn{position:fixed;right:18px;bottom:86px;width:38px;height:38px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--border2);color:var(--text);cursor:pointer;
    display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:6;transition:.18s}
  #scrollBtn.show{display:grid}
  #scrollBtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  .modebtn{
    padding:6px 12px;border-radius:8px;border:1px solid var(--border2);
    background:var(--panel2);color:var(--dim);font-size:calc(13px * var(--fs));font-weight:600;
    cursor:pointer;transition:.16s;margin-right:2px;
  }
  .modebtn:hover{background:#222c38;color:var(--text)}
  /* Agent 用青绿系，跟对话模式的蓝色区分开，一眼能看出当前在执行什么 */
  .modebtn.on{background:linear-gradient(135deg,#34d399,#0ea371);
    border-color:transparent;color:#052e1f;box-shadow:0 2px 10px rgba(52,211,153,.32)}
  /* Agent 气泡：内容多，给足宽度（普通气泡是 fit-content，会缩成一条） */
  .bubble.agent-bubble{width:min(88%,760px);max-width:min(88%,760px)}
  .bubble.agent-bubble .agent-wrap{width:100%}
  .agent-wrap{display:flex;flex-direction:column;gap:7px;min-width:0;max-width:100%}
  .astep{background:linear-gradient(180deg,rgba(52,211,153,.06),rgba(52,211,153,.025));
    border:1px solid rgba(52,211,153,.24);border-radius:11px;padding:12px 15px;
    min-width:0;max-width:100%;overflow:hidden}
  .astep-h{display:flex;align-items:center;gap:9px;font-size:calc(14.5px * var(--fs))}
  .astep-h b{width:19px;height:19px;border-radius:50%;
    background:linear-gradient(135deg,#34d399,#0ea371);color:#052e1f;
    display:inline-flex;align-items:center;justify-content:center;font-size:calc(12.5px * var(--fs));
    flex:none;font-weight:800}
  .chip{background:rgba(52,211,153,.18);color:#6ee7b8;padding:2px 9px;
    border-radius:6px;font-size:calc(13.5px * var(--fs));font-weight:650;
    font-family:ui-monospace,Menlo,monospace;
    border:1px solid rgba(52,211,153,.24)}
  .astep.streaming{border-style:dashed;border-color:rgba(251,191,36,.45);
    background:linear-gradient(180deg,rgba(251,191,36,.07),rgba(251,191,36,.02))}
  .astep.streaming .chip{background:#3a2f12;color:#fbbf24}
  .astep.streaming .chip:after{content:" ●";animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .astep-h code{color:#a8e0cd;font-size:calc(13.5px * var(--fs));background:#0d1a17;padding:2px 8px;
    border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:52%;font-family:ui-monospace,Menlo,monospace;
    border:1px solid rgba(52,211,153,.16)}
  .secs{margin-left:auto;color:#93a0ae;font-size:calc(13.5px * var(--fs));flex:none;
    font-variant-numeric:tabular-nums}
  .astep-r{color:#b3c0cd;font-size:calc(14.5px * var(--fs));line-height:1.72;margin-top:9px;
    white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;
    padding-left:9px;border-left:2px solid rgba(52,211,153,.28)}
  /* 推理/正文类内容完整展开，不折叠（数学推导被裁一半等于没有） */
  /* full = 内容完整展开（数学推导不能裁）。高度不限，但横向溢出
     必须在气泡内部滚 —— 以前是 overflow:visible，宽表格直接顶出卡片。 */
  .astep-r.full{max-height:none;overflow:auto;overflow-y:visible}
  .afinal{font-size:calc(17.5px * var(--fs));line-height:1.85;color:var(--text);margin-top:7px;white-space:pre-wrap}
  /* 最终回答里的表格：分列对齐显示（"名称 | 数值"拼一行看不出来） */
  .afinal table{border-collapse:collapse;margin:8px 0;font-size:calc(15.5px * var(--fs));
    white-space:normal;width:100%;table-layout:fixed}
  .afinal th,.afinal td{border:1px solid var(--border);padding:6px 10px;
    text-align:left;vertical-align:top;word-break:break-word}
  .afinal th{background:var(--panel2);font-weight:600;color:var(--dim)}
  .afinal td:first-child{width:72%}
  .afinal td:last-child,.afinal th:last-child{text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .astat{color:#8794a1;font-size:calc(13px * var(--fs));text-align:right;
    font-variant-numeric:tabular-nums}
  .awarn{color:#efb44d;font-size:calc(14px * var(--fs));background:rgba(239,180,77,.1);
    border-left:2px solid #efb44d;padding:7px 11px;border-radius:0 7px 7px 0}

    border-radius:11px;font-size:calc(14px * var(--fs));opacity:0;pointer-events:none;transition:.24s;z-index:20;

/* 环境与插件面板（顶部按钮点开） */
.envpanel{position:fixed;top:52px;right:14px;z-index:60;display:none;
  min-width:270px;max-width:350px;max-height:70vh;overflow-y:auto;

  font-size:calc(13px * var(--fs));color:#c8d3e0}

.envpanel h4{margin:0 0 7px;font-size:calc(12.5px * var(--fs));color:#9aa7b6;font-weight:600;letter-spacing:.5px}
.envpanel .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.envpanel .plist{display:flex;flex-direction:column;gap:5px}
.envpanel .pitem{padding:6px 9px;border-radius:7px;background:#101822;border:1px solid #1f2a38}
.envpanel .pitem b{color:#8ee6c8;font-size:calc(13px * var(--fs));font-weight:600}
.envpanel .pitem span{display:block;color:#94a1b0;font-size:calc(12.5px * var(--fs));margin-top:2px;line-height:1.35}
/* 自动化插件：和被动工具区分开 */
.envpanel .pitem.auto{border-color:#2d5f52;background:#0e1d19}
.envpanel .pitem span.pill{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
  font-size:calc(11.5px * var(--fs));background:#243044;color:#8fb3ff;vertical-align:1px;font-weight:400}
.envpanel .pitem.auto span.pill{background:#164034;color:#6ee7b7}
.envpanel .trg{font-size:calc(12.5px * var(--fs));color:#9aa7b6;margin-top:2px;font-family:monospace}
.envpanel .autoact{margin-top:6px;padding:2px 12px;border-radius:6px;cursor:pointer;
  font-size:calc(12.5px * var(--fs));background:#1c3a30;color:#6ee7b7;border:1px solid #2d5f52}
.envpanel .autoact:hover{background:#245043}
.envpanel .autoact.bg{background:#182434;color:#8fb3ff;border-color:#2d415f;margin-left:6px}
.envpanel .autoact.bg:hover{background:#1f3049}

.envpanel .autoact.stop:hover{background:#4a2424}

.envpanel .chip.rt i{background:#4d9bff;box-shadow:0 0 6px #4d9bff}
.envpanel .chip.lib{color:#c9b8ff;border-color:#453a6b;background:#171327}
.envpanel .chip.lib i{background:#a78bfa;box-shadow:0 0 6px #a78bfa}

/* 环境 + LaTeX 公式（客户端渲染，不依赖外部库/CDN） */
.tex{font-family:"Latin Modern Math","Cambria Math","Times New Roman",serif;
  font-style:italic;white-space:nowrap}
.tex .frc{display:inline-flex;flex-direction:column;vertical-align:middle;
  text-align:center;font-size:.85em;line-height:1.08;margin:0 .15em}
.tex .frc .num{border-bottom:1px solid currentColor;padding:0 4px}
.tex .frc .den{padding:0 4px}
.tex .sqrt{white-space:nowrap}
.tex .sqrt .rad{border-top:1px solid currentColor;padding:0 3px;margin-left:-1px}
.texblk{text-align:center;margin:12px 0;font-size:calc(16px * var(--fs));
  font-family:"Latin Modern Math","Cambria Math","Times New Roman",serif;font-style:italic}
.tex sup,.tex sub,.texblk sup,.texblk sub{font-size:.72em;font-style:normal}
/* 插件结果的附加信息（方程、解、天数这些小字） */
.pmeta{margin-top:5px;font-size:calc(13px * var(--fs));color:var(--dim2);
  border-left:2px solid var(--border2);padding-left:7px}
.pmeta .err{color:var(--err)}
/* 步骤卡片里的表格（table 插件返回 markdown 表格，渲染出来要有网格） */
/* 表格宽度按内容走，别用 fixed —— 12 列均分宽度会把中文挤成每行 3 个字。
   列最少 80px、最多 320px，超了换行；整个表格超宽就横向滚动。 */
.astep-r table{border-collapse:collapse;margin:8px 0;font-size:calc(14px * var(--fs));
  width:max-content;min-width:100%;table-layout:auto}
.astep-r th,.astep-r td{border:1px solid var(--border);padding:4px 8px;
  text-align:left;white-space:normal;word-break:break-word;
  min-width:80px;max-width:320px;vertical-align:top}
.astep-r th{background:var(--panel2);font-weight:600;color:var(--text)}
.astep-r .texblk{font-size:calc(16px * var(--fs))}
  /* 表格单独包一层：宽表格在表格自己身上滚，滚动条紧贴表格底边，
     不会被 31 行的内容推到气泡最下面（那样等于看不到滚动条）。 */
  /* 高度不能写死 440px：视口矮的时候容器底边跑到屏幕外，
     横向滚动条就永远看不到。用 55vh 封顶，滚动条始终在视野内。 */
  .tblwrap{overflow:auto;max-height:min(440px,55vh);max-width:100%;
    margin:8px 0;border:1px solid var(--border);border-radius:7px;
    scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.55) rgba(255,255,255,.06)}
  .tblwrap table{margin:0;border:none}
  /* 表格是最后一项时，别留底部空隙（气泡会显得空一大截） */
  .astep-r > .tblwrap:last-child{margin-bottom:0}
  .astep-r > *:last-child{margin-bottom:0}
  /* 气泡内最后一块不再叠加下边距 */
  .agent-wrap > *:last-child{margin-bottom:0}
  .tblwrap::-webkit-scrollbar{height:12px;width:12px;-webkit-appearance:none}
  .tblwrap::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:6px}
  .tblwrap::-webkit-scrollbar-thumb{background:rgba(52,211,153,.5);border-radius:6px;
    border:2px solid transparent;background-clip:content-box}
  .tblwrap::-webkit-scrollbar-thumb:hover{background:rgba(52,211,153,.55)}
  /* 气泡内的滚动条：细、深色、悬停才亮 */
  .astep-r::-webkit-scrollbar{height:9px;width:9px}
  .astep-r::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:5px}
  .astep-r::-webkit-scrollbar-thumb{background:rgba(52,211,153,.28);border-radius:5px}
  .astep-r::-webkit-scrollbar-thumb:hover{background:rgba(52,211,153,.5)}
  .astep-r{scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.35) transparent}

  .fixt{font-size:calc(13px * var(--fs));color:#cfd6e0;font-weight:600;margin-bottom:3px}

<script>
(function(){

  function applyFS(){

  function toast(msg, ms){

  function esc(s){

  /* 下标数字 → Unicode 下标（化学式 H_2O、数学 x_{12} 都用）
     只处理 _ 后跟数字，避免误伤 my_var 这种标识符。 */
  var SUBMAP = "₀₁₂₃₄₅₆₇₈₉";
  var SUPMAP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function toSup(digits){
    return String(digits).split("").map(function(c){
      var n = +c;
      return isNaN(n) ? c : SUPMAP.charAt(n);
    }).join("");
  }
  function toSub(digits){
    return String(digits).split("").map(function(c){
      var n = +c;
      return isNaN(n) ? c : SUBMAP.charAt(n);
    }).join("");
  }

  function demathLight(s){
    return String(s)
      .replace(/\\\[|\\\]|\\\(|\\\)|\$\$/g, " ")
      .replace(/\\sqrt\s*\{([^{}]*)\}/g, function(m, inner){
        return /^[\w\u0370-\u03ff]$/.test(inner) ? "√" + inner : "√(" + inner + ")";
      })
      .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "($1)/($2)")
      .replace(/\\[a-zA-Z]+/g, "")
      .replace(/[{}]/g, "")
      .replace(/\^\{?-\}?/g, "⁻").replace(/\^\{?\+\}?/g, "⁺")
      .replace(/_\{?(\d+)\}?/g, function(m, d){ return toSub(d); });
  }

  /* 模型爱吐 LaTeX 且不再在 prompt 里花钱纠正它，全部在这里转成可读文本。
     不追求排版精度，只求"人能看懂、不留反斜杠"。 */
  function demath(s){
    return String(s)
      /* 定界符 / 环境 */
      .replace(/\\\[|\\\]|\\\(|\\\)|\$\$/g, " ")
      .replace(/\\begin\{[^}]*\}|\\end\{[^}]*\}/g, " ")
      /* 带参数的构造 */
      /* 根号：单字符直接 √x；多项内容必须加括号，否则 √x+y 分不清根号范围 */
      .replace(/\\sqrt\s*\[([^\]]*)\]\s*\{([^{}]*)\}/g, function(m, n, inner){
        return /^[\w\u0370-\u03ff]$/.test(inner) ? n + "√" + inner : n + "√(" + inner + ")";
      })
      .replace(/\\sqrt\s*\{([^{}]*)\}/g, function(m, inner){
        return /^[\w\u0370-\u03ff]$/.test(inner) ? "√" + inner : "√(" + inner + ")";
      })
      .replace(/\\sqrt\s*([0-9A-Za-z])/g, "√$1")
      .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "($1)/($2)")
      .replace(/\\[ntr]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "($1)/($2)")
      .replace(/\\(?:text|mathrm|mathbf|mathit|operatorname)\s*\{([^{}]*)\}/g, "$1")
      /* 关系 / 运算 */
      .replace(/\\approx/g, "≈").replace(/\\neq|\\ne\b/g, "≠")
      .replace(/\\leq?/g, "≤").replace(/\\geq?/g, "≥")
      .replace(/\\ll\b/g, "≪").replace(/\\gg\b/g, "≫")
      .replace(/\\equiv/g, "≡").replace(/\\propto/g, "∝")
      .replace(/\\pm/g, "±").replace(/\\mp/g, "∓")
      .replace(/\\times/g, "×").replace(/\\div/g, "÷").replace(/\\cdot/g, "·")
      .replace(/\\int/g, "∫").replace(/\\sum/g, "Σ").replace(/\\prod/g, "∏")
      .replace(/\\partial/g, "∂").replace(/\\nabla/g, "∇").replace(/\\infty/g, "∞")
      .replace(/\\notin/g, "∉").replace(/\\in\b/g, "∈")
      .replace(/\\cup/g, "∪").replace(/\\cap/g, "∩").replace(/\\subset/g, "⊂")
      .replace(/\\leftrightarrow|\\Leftrightarrow/g, "↔").replace(/\\leftarrow/g, "←")
      .replace(/\\Rightarrow/g, "⇒").replace(/\\to\b|\\rightarrow/g, "→")
      /* 希腊字母 */
      .replace(/\\alpha/g, "α").replace(/\\beta/g, "β").replace(/\\gamma/g, "γ")
      .replace(/\\delta/g, "δ").replace(/\\epsilon/g, "ε").replace(/\\zeta/g, "ζ")
      .replace(/\\eta/g, "η").replace(/\\theta/g, "θ").replace(/\\kappa/g, "κ")
      .replace(/\\lambda/g, "λ").replace(/\\mu/g, "μ").replace(/\\nu/g, "ν")
      .replace(/\\xi/g, "ξ").replace(/\\pi\b/g, "π").replace(/\\rho/g, "ρ")
      .replace(/\\sigma/g, "σ").replace(/\\tau/g, "τ").replace(/\\phi/g, "φ")
      .replace(/\\chi/g, "χ").replace(/\\psi/g, "ψ").replace(/\\omega/g, "ω")
      .replace(/\\Gamma/g, "Γ").replace(/\\Delta/g, "Δ").replace(/\\Theta/g, "Θ")
      .replace(/\\Lambda/g, "Λ").replace(/\\Pi/g, "Π").replace(/\\Sigma/g, "Σ")
      .replace(/\\Phi/g, "Φ").replace(/\\Psi/g, "Ψ").replace(/\\Omega/g, "Ω")
      /* 排版命令残渣 */
      .replace(/\\(?:left|right|big|Big|bigg|Bigg)\s*/g, "")
      .replace(/\\[,;:!]/g, " ").replace(/\\q?quad/g, "  ")
      .replace(/\\ldots|\\cdots|\\dots/g, "…")
      .replace(/\^\{?2\}?/g, "²").replace(/\^\{?3\}?/g, "³").replace(/\^\{?n\}?/g, "ⁿ")
      /* 离子/电荷：e^- → e⁻、H^+ → H⁺（化学方程式必用） */
      .replace(/\^\{?-\}?/g, "⁻").replace(/\^\{?\+\}?/g, "⁺")
      .replace(/\^\{?(\d{1,2})\}?/g, function(d, m){ return toSup(m); })
      /* 下标：H_2O → H₂O、x_{12} → x₁₂（化学式和数学都常见）
       * 长度必须限制：化学式下标最多 3 位（C12H22O11），
       * 不限制的话文件名 multi_1795017919.xlsx 会被改成
       * multi₁₇₉₅₀₁₇₉₁₉.xlsx —— 用户看到的就是一排问号。 */
      .replace(/_\{?(\d{1,3})\}?/g, function(m, d){ return toSub(d); })
      /* 兜底：剩余命令与花括号 */
      .replace(/\\[a-zA-Z]+/g, "")

  /* 轻量 markdown（够用就好）：表格 / 有序无序列表 / 标题 / 引用 / 粗斜体 / 行内代码 */
  function mdInline(t){
    var lines = String(t || "").split("\n");
    var out = [], i = 0;
    function inline(s){
      return s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
              .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
              .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    }
    while (i < lines.length){
      var L = lines[i];
      /* 表格：首行 | a | b |，次行 |---|---| */
      if (/^\s*\|.*\|\s*$/.test(L) && i + 1 < lines.length
          && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
        var head = L.split("|").slice(1, -1).map(function(c){ return inline(c.trim()); });
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
          rows.push(lines[i].split("|").slice(1, -1).map(function(c){ return inline(c.trim()); }));
          i++;
        }
        var h = "<table><thead><tr>";
        head.forEach(function(c){ h += "<th>" + c + "</th>"; });
        h += "</tr></thead><tbody>";
        rows.forEach(function(r){
          h += "<tr>";
          r.forEach(function(c){ h += "<td>" + c + "</td>"; });
          h += "</tr>";
        });
        out.push(h + "</tbody></table>");
        continue;
      }
      /* 无序列表 */
      if (/^\s*[-*+]\s+/.test(L)){
        var li1 = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
          li1.push("<li>" + inline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ul>" + li1.join("") + "</ul>");
        continue;
      }
      /* 有序列表 */
      if (/^\s*\d+[.)]\s+/.test(L)){
        var li2 = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){
          li2.push("<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ol>" + li2.join("") + "</ol>");
        continue;
      }
      /* 标题 */
      var hd = L.match(/^(#{1,4})\s+(.*)$/);
      if (hd){
        var lv = Math.min(hd[1].length + 2, 6);
        out.push("<h" + lv + ">" + inline(hd[2]) + "</h" + lv + ">");
        i++;
        continue;
      }
      /* 引用（注意 esc() 已经把 > 转成了 &gt;） */
      if (/^\s*(&gt;|>)\s?/.test(L)){
        var qs = [];
        while (i < lines.length && /^\s*(&gt;|>)\s?/.test(lines[i])){
          qs.push(lines[i].replace(/^\s*(&gt;|>)\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + inline(qs.join("<br>")) + "</blockquote>");
        continue;
      }
      out.push(inline(L));
      i++;
    }
    return out.join("\n");
  }

  /* 极简语法高亮（不引第三方库）。
     做法：先把字符串和注释摘成占位符，再给关键字染色，最后放回来 ——
     否则注释里的 import/def 也会被当关键字涂色，或者 span 标签自身被二次匹配。 */
  function hlCode(s){
    var store = [];
    function keep(cls, txt){
      store.push('<span class="' + cls + '">' + txt + '</span>');
      return "\u0000" + (store.length - 1) + "\u0000";
    }
    var t = s
      .replace(/(#[^\n]*)/g, function(m){ return keep("c-cm", m); })
      .replace(/(\/\/[^\n]*)/g, function(m){ return keep("c-cm", m); })
      /* 三引号 docstring 要排在普通字符串前面。
         坑：esc() 只转 & < >，双引号可能原样保留，也可能在别处成了 &quot; 实体，
         所以正则里两种形式都得认。 */
      .replace(/((?:"|&quot;){3}[\s\S]*?(?:"|&quot;){3}|(?:'|&#39;){3}[\s\S]*?(?:'|&#39;){3})/g,
               function(m){ return keep("c-st", m); })
      .replace(/((?:"|&quot;)[^\n]*?(?:"|&quot;)|'[^'\n]*')/g,
               function(m){ return keep("c-st", m); });
    t = t.replace(/\b(import|from|as|def|class|return|if|elif|else|for|while|try|except|finally|with|lambda|yield|raise|pass|break|continue|and|or|not|in|is|None|True|False|const|let|var|function|new|this|async|await|require|module|exports|package|public|private|static|void|int|float|double|bool|String|print)\b/g,
                  '<span class="c-kw">$1</span>');
    return t.replace(/\u0000(\d+)\u0000/g, function(_, i){ return store[+i]; });
  }

  /* ---------- LaTeX 公式（轻量渲染，纯客户端） ----------
     支持 $行内$ / $$块级$$、\frac、\sqrt、^{}、_{} 和常见符号。
     做法：先把 $...$ 抽成占位符再交给 markdown，最后还原 ——
     否则公式里的 * _ ^ 会被 markdown 当强调/下标改坏。 */
  var TEX_MAP = {
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', varepsilon:'ε',
    zeta:'ζ', eta:'η', theta:'θ', iota:'ι', kappa:'κ', lambda:'λ', mu:'μ',
    nu:'ν', xi:'ξ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', upsilon:'υ', phi:'φ',
    varphi:'φ', chi:'χ', psi:'ψ', omega:'ω',
    Gamma:'Γ', Delta:'Δ', Theta:'Θ', Lambda:'Λ', Pi:'Π', Sigma:'Σ',
    Phi:'Φ', Omega:'Ω', Psi:'Ψ',
    times:'×', div:'÷', pm:'±', mp:'∓', le:'≤', leq:'≤', ge:'≥', geq:'≥',
    ne:'≠', neq:'≠', approx:'≈', equiv:'≡', sim:'∼', propto:'∝',
    infty:'∞', cdot:'·', ldots:'…', dots:'…', cdots:'⋯',
    to:'→', rightarrow:'→', leftarrow:'←', Rightarrow:'⇒', Leftarrow:'⇐',
    leftrightarrow:'↔',
    sum:'∑', prod:'∏', int:'∫', iint:'∬', partial:'∂', nabla:'∇',
    angle:'∠', triangle:'△', perp:'⊥', parallel:'∥', because:'∵',
    therefore:'∴', degree:'°', prime:'′', circ:'∘',
    in:'∈', notin:'∉', subset:'⊂', supset:'⊃', cup:'∪', cap:'∩',
    empty:'∅', forall:'∀', exists:'∃', neg:'¬', land:'∧', lor:'∨'
  };

  function texBody(tex){
    var s = esc(tex);
    /* 分数（允许嵌套几层） */
    for (var i = 0; i < 3; i++) {
      s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,
        '<span class="frc"><span class="num">$1</span><span class="den">$2</span></span>');
    }
    /* 根号 */
    s = s.replace(/\\sqrt\[([^\]]*)\]\{([^{}]*)\}/g,
      '<span class="sqrt"><sup>$1</sup>√<span class="rad">$2</span></span>');
    s = s.replace(/\\sqrt\{([^{}]*)\}/g, '<span class="sqrt">√<span class="rad">$1</span></span>');
    s = s.replace(/\\sqrt/g, '√');
    /* 上下标 */
    s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^([\w.])/g, '<sup>$1</sup>');
    s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/_([\w.])/g, '<sub>$1</sub>');
    /* 命令 → 符号；认不出的命令直接去掉反斜杠 */
    s = s.replace(/\\([a-zA-Z]+)/g, function(m, n){ return TEX_MAP[n] || n; });
    /* 排版指令扔掉 */
    s = s.replace(/\\(left|right|displaystyle|limits|quad|qquad|,|;|!| )/g, ' ');
    s = s.replace(/\\\\/g, ' ');
    s = s.replace(/[{}]/g, '');
    return s;
  }

  function protectMath(s){
    var store = [];
    /* 行内代码里的 $ 不是公式（比如 `awk '{print $1}'`），先保护起来 */
    s = s.replace(/`([^`\n]+)`/g, function(m, c){
      store.push('<code>' + esc(c) + '</code>');
      return "@@TEX" + (store.length - 1) + "@@";
    });
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, function(m, t){
      store.push('<div class="texblk">' + texBody(t) + '</div>');
      /* 前后留空行：不然紧跟着的 markdown 表格会被粘到同一行，渲染不出来 */
      return "\n\n@@TEX" + (store.length - 1) + "@@\n\n";
    });
    s = s.replace(/\$([^$\n]{2,200}?)\$/g, function(m, t){
      store.push('<span class="tex">' + texBody(t) + '</span>');
      return "@@TEX" + (store.length - 1) + "@@";
    });
    return { text: s, store: store };
  }

  function restoreMath(html, store){
    /* 块级公式被 markdown 包成 <p>@@TEX0@@</p>，整段换掉（div 不能嵌在 p 里） */
    html = html.replace(/<p>\s*@@TEX(\d+)@@\s*<\/p>/g, function(_, i){ return store[+i] || ''; });
    return html.replace(/@@TEX(\d+)@@/g, function(_, i){ return store[+i] || ''; });
  }

  function render(text, withCopy, light){
    /* 先按 ``` 分块，再分别处理：
       代码块只做 HTML 转义 + 高亮，绝不跑 demath（那是给人话看的数学符号转换，
       会把代码里的 """、\\ 之类改坏）；普通文本才 demath + markdown。 */
    var parts = String(text || "").split(/```/);
    var html = "";
    for (var i = 0; i < parts.length; i++){
      if (i % 2 === 1){
        var body = parts[i].replace(/^[a-zA-Z0-9_+-]*\n/, "").replace(/\n$/, "");
        html += "<pre><code>" + hlCode(esc(body)) + "</code>" +
                (withCopy ? '<button class="copy">复制</button>' : "") + "</pre>";
      } else {
        /* 顺序很关键：先把 $...$ 抽成占位符，再跑 demath。
         * demath 会把 \frac{1}{2} 改写成 (1)/(2)，跑在它前面就毁了公式。 */
        var pm = protectMath(parts[i]);
        var plain = light ? demathLight(pm.text) : demath(pm.text);
        html += restoreMath(mdInline(esc(plain)), pm.store);
      }
    }
    return html;
  }
  window.render = render;          /* 方便控制台调试 */

  function nearBottom(){ return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90; }
  /* 程序滚动 vs 用户滚动要分开：
     内容频繁增长时 scroll 事件也会触发，如果不屏蔽，
     nearBottom() 会把"内容变高了"误判成"用户往上滚了"，
     stickBottom 被置 false，之后就再也不跟随了。 */
  var progScroll = false;
  function scrollDown(force){
    if (!force && !stickBottom) return;
    progScroll = true;
    chat.scrollTop = chat.scrollHeight;
    requestAnimationFrame(function(){ progScroll = false; });
  }
  chat.addEventListener("scroll", function(){
    if (progScroll) return;              // 自己滚的，不算用户意图
    stickBottom = nearBottom();
    scrollBtn.classList.toggle("show", !stickBottom);
  });
  scrollBtn.addEventListener("click", function(){ chat.scrollTop = chat.scrollHeight; });
  function scrollDown(force){ if (force || stickBottom) chat.scrollTop = chat.scrollHeight; }

  chat.addEventListener("click", function(e){
    if (!e.target.classList || !e.target.classList.contains("copy")) return;
    var code = e.target.parentNode.querySelector("code");
    if (!code) return;
    var txt = code.textContent;
    var done = function(){ e.target.textContent = "已复制"; setTimeout(function(){ e.target.textContent = "复制"; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ legacyCopy(txt) && done(); });
    } else if (legacyCopy(txt)) done();
    else toast("复制失败，请手动选择");
  });
  function legacyCopy(txt){
    try {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch(e){ return false; }
  }

  function addMsg(role, html){
    var w = el("welcome");
    if (w && w.parentNode) w.parentNode.removeChild(w);
    var row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot");
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "我" : "AI";
    /* AI 头像点一下直接开设置（快捷问题 + 插件开关）。它天天在眼前，
     * 比去右上角找那个小铅笔方便。 */
    if (role !== "user") {
      who.classList.add("who-ai");
      who.title = "点一下打开设置（快捷问题 / 插件开关）";
      who.addEventListener("click", function(){
        try { editQuick(); } catch (e) {}
      });
    }
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (html) bubble.innerHTML = html;
    row.appendChild(who); row.appendChild(bubble);
    chat.appendChild(row);
    // 长消息（超过 max-height）默认滚到末尾：用户要看的是刚发的最后一段，
    // 停在开头会让人以为"卡住了 / 只有这么点"。
    if (role === "user" && bubble.scrollHeight > bubble.clientHeight) {
      bubble.scrollTop = bubble.scrollHeight;
    }
    scrollDown(true);
    return bubble;
  }

  /* ---------- 口令（只存在浏览器） ---------- */
  function storedKey(){ return localStorage.getItem(KEY_STORE) || ""; }
  function authHeaders(extra){
    var h = extra || {};
    var k = storedKey();
    if (k) h["Authorization"] = "Bearer " + k;
    return h;
  }
  function askKey(msg){
    var v = window.prompt(msg || "该服务设了访问口令，请输入（留空 = 清除）：", "");
    if (v === null) return false;

    else localStorage.setItem(KEY_STORE, v);

  }

  /* ---------- 配置发现：端口/模型全部来自 UCI，页面不猜 ---------- */
  function loadConf(){
    return fetch("/cgi-bin/llama?_=" + Date.now(), {cache: "no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.ok){
          setState("err", "配置缺失");
          toast((j && j.error) ? j.error : "读不到 /etc/config/llama 的配置", 6000);
          return false;

      })
      .catch(function(){

        toast("读不到 /cgi-bin/llama，检查 uhttpd 是否正常", 6000);
        return false;
      });
  }

  function probe(){
    fetch(API + "/health", {cache: "no-store", headers: authHeaders()})
      .then(function(r){
        if (r.status === 401){
          setState("err", "需要口令");
          if (!probe._asked){
            probe._asked = 1;
            if (askKey("服务开启了访问口令，请输入：")) setTimeout(probe, 300);
          }
          return null;
        }
        return r.json();
      })
      .then(function(j){
        if (!j) return;
        if (j.status === "ok"){
          setState("ok", CONF.model || "已就绪");
        } else {
          setState("load", "模型加载中…");
          setTimeout(probe, 3000);
        }
      })
      .catch(function(){
        setState("err", "服务未启动");
        if (!probe._warned){
          probe._warned = 1;
          toast("后端没响应：检查 llama-server 是否启用、端口是否对", 5000);
        }
        setTimeout(probe, 5000);
      });

  /* ---------- 发送 ---------- */
  function autosize(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";

  input.addEventListener("input", autosize);

  /* ---------- 对话 / Agent 双模式 ---------- */
  var MODE = "agent";        /* 默认就是 Agent 模式（按钮点亮） */

  (function initMode(){
    var btn = document.getElementById("modebtn");
    if (!btn) return;
    /* 先按当前 MODE 把按钮和输入框提示渲染好，避免初始状态与按钮文字对不上 */

        ? "给 Agent 一个任务，例如：看看 /tmp 下最大的文件"
        : "说点什么…（Enter 发送，Shift+Enter 换行）";
      toast(MODE === "agent"
        ? "Agent 模式：能调用工具、多步执行（慢，一步 1-2 分钟）"
        : "已切回对话模式");
    });
  })();

  /* 输出里出现的文件名变成可下载链接；音频类直接给个播放器 */
  /* 先匹配完整路径（带 /），再退化到裸文件名。
   * 只匹配文件名的话，"/tmp/llama_agent/bgm_x.mp3" 会被拆成
   * "路径文字 + 链接"，插进表格单元格就把排版撑坏了。 */
  var FILE_RE = /(\/[A-Za-z0-9_\u4e00-\u9fa5.\-\/]*\.(?:mid|midi|wav|mp3|ogg|pptx|py|md|txt|csv))|([A-Za-z0-9_\u4e00-\u9fa5.\-]+\.(?:mid|midi|wav|mp3|ogg|pptx|py|md|txt|csv))/g;
  /* 给每个 table 套一层滚动容器（markdown 渲染器不负责布局） */
  function wrapTables(html){
    return String(html || "")
      .replace(/<table/g, '<div class="tblwrap"><table')
      .replace(/<\/table>/g, '</table></div>');
  }

  /* 一段输出里常常是"人话 + 标记行 + JSON 结果"混在一起，整段判断 isJsonObj
   * 一定是 false，于是 xlsx 那种结果被当纯文本打印出来（原始 JSON），
   * 下载按钮也没了。这里逐行切开：JSON 行单独走卡片渲染，其余按文本走。 */
  function mixedRender(text){
    var lines = String(text || "").split("\n");
    var out = [], buf = [];
    function flush(){
      if (!buf.length) return;
      var t = buf.join("\n");
      buf = [];
      if (!t.trim()) return;
      var x = linkFiles(render(t, false, true));
      out.push(x + audioPlayers(x) + videoPlayers(x));
    }
    for (var i = 0; i < lines.length; i++) {
      var s = String(lines[i]).trim();
      if (s.charAt(0) === "{" && s.charAt(s.length - 1) === "}") {
        var okj = false;
        try { JSON.parse(s); okj = true; } catch (e) {}
        if (okj) { flush(); out.push(pluginResultHtml(s)); continue; }
      }
      buf.push(lines[i]);
    }
    flush();
    return out.join("");
  }

  function linkFiles(html){
    return html.replace(FILE_RE, function(m){
      var href = "/cgi-bin/agent?file=" + encodeURIComponent(m);
      return '<a class="fdl" href="' + href + '" download>' + m + '</a>';
    });
  }

  /* ---------- ffmpeg 后台任务进度条 ----------
   * 长片转码会跑几分钟到几十分钟。插件返回 {"async":1,"id":"portrait_xxx"}，
   * 这里画一个进度窗体，每 2 秒问一次 ?vprog=<id>（轻量接口，不走模型）。
   * 完成后就地换成下载按钮 + 播放器。 */
  function fmtSec(n){
    n = Math.max(0, Math.round(n || 0));
    var m = Math.floor(n / 60), sec = n % 60;
    return m ? (m + " 分 " + sec + " 秒") : (sec + " 秒");
  }

  function vjobPoll(el){
    if (el.dataset.started) return;
    el.dataset.started = "1";
    var id = el.dataset.id, t0 = Date.now();
    var pctEl = el.querySelector(".vjob-pct"),
        barEl = el.querySelector(".vjob-bar i"),
        metaEl = el.querySelector(".vjob-meta"),
        headEl = el.querySelector(".vjob-t");

    function step(){
      fetch("/cgi-bin/agent?vprog=" + encodeURIComponent(id) + "&_=" + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j || !j.ok) { metaEl.textContent = "查不到任务状态"; return; }
          var pct = Math.max(0, Math.min(100, j.pct || 0));
          pctEl.textContent = pct + "%";
          barEl.style.width = pct + "%";
          metaEl.textContent = "已处理 " + fmtSec(j.done_sec) + " / " + fmtSec(j.total_sec)
                             + " · 已用 " + fmtSec((Date.now() - t0) / 1000);
          if (j.state === "done") {
            el.classList.add("vjob-done");
            headEl.textContent = "处理完成";
            pctEl.textContent = "100%";
            barEl.style.width = "100%";
            metaEl.textContent = "输出 " + (j.size / 1048576).toFixed(1) + " MB · 已用 "
                               + fmtSec((Date.now() - t0) / 1000);
            var name = (j.out || "").split("/").pop();
            var href = "/cgi-bin/agent?file=" + encodeURIComponent(j.out);
            var card = document.createElement("div");
            card.innerHTML = '<div class="dlrow"><a class="fdl" href="' + href + '">'
                           + '⬇ 下载 ' + esc(name) + '</a><span class="vjsz">'
                           + (j.size / 1048576).toFixed(1) + ' MB</span></div>';
            /* 任务带 src（源文件）时，完成态也出"原片 / 处理后"双播放器 */
            el.appendChild(card);
            /* 播放器延迟 2 秒再挂：任务报 done 时 ffmpeg 还在写 moov atom，
             * 立刻请求会拿到半截文件并永久报错（实测 err=4、画面全黑），
             * Chrome 会把失败缓存住，onerror 重试也救不回来。 */
            var _src = j.src, _out = j.out, _href = href, _nm = name;
            setTimeout(function(){
              var vids = _src ? dualPlayers(_src, _out)
                              : videoPlayers('<a href="' + _href + '">' + esc(_nm) + '</a>');
              if (vids) el.insertAdjacentHTML("beforeend", vids);
            }, 2000);
            return;
          }
          if (j.state === "stopped") {
            headEl.textContent = "任务中断";
            pctEl.textContent = "—";
            metaEl.textContent = "ffmpeg 已退出（可能失败或被 kill）";
            return;
          }
          setTimeout(step, 2000);
        })
        .catch(function(){ setTimeout(step, 4000); });
    }
    step();
  }

  /* 新出现的进度窗体自动开始轮询（渲染完再扫，省得每处都手动调用） */
  setInterval(function(){
    var list = document.querySelectorAll(".vjob[data-id]");
    for (var i = 0; i < list.length; i++) vjobPoll(list[i]);
  }, 1200);

  /* 视频播放器：和音频一样放在卡片底部。cgi 已经支持 Range(206)，
   * 所以手机上能拖进度条；preload=metadata 只先取头部，不浪费流量。 */

  /* 原片 / 处理后 双播放器：改过视频的结果里带 src（源文件），
   * 两个一起显示，效果对比最直观。都走 mediad（:8091），能拖进度条。 */
  var VIDEXT = /\.(mp4|mkv|webm|mov|m4v|avi|flv|ts|m2ts|mpg|mpeg)$/i;
  function isVid(p){ return VIDEXT.test(String(p || "").split("?")[0].split("#")[0]); }

  function dualPlayers(srcPath, outPath){
    /* 只给真视频做播放器：图片修复结果里也有 src/file 字段，
     * 以前会被这里当成"原片/处理后"造出两个 <video>（用户看到的"图片变成播放器"）。 */
    if (!srcPath || !outPath) return "";
    if (!isVid(srcPath) || !isVid(outPath)) return "";
    var host = location.hostname || "127.0.0.1";
    /* 末尾加 #t=0.5：只写 preload=metadata 时浏览器不渲染首帧，框是黑的；
     * 带时间片段的 URL 会强制显示那一帧，两个播放器都有画面才好对比。 */
    var url = function(p){ return "//" + host + ":8091/f/" + encodeURIComponent(String(p).split("/").pop()) + "#t=0.5"; };
    var one = function(label, p, cls){
      return '<div class="vdual-item">'
        + '<div class="vdual-t">' + label + '</div>'
        + '<video class="' + cls + '" controls preload="auto" playsinline'
        + ' onloadedmetadata="try{this.currentTime=0.5}catch(e){}"'
        /* 任务刚 done 时 ffmpeg 可能还在写 moov，浏览器拿到半截就永久报错，
         * 这里最多重试 3 次（每次 1.5 秒），拿到的就是完整文件 */
        + ' onerror="var n=+(this.dataset.r||0);if(n<3){this.dataset.r=n+1;var u=this.src;setTimeout(function(v){v.load()},1500,this)}"'
        + ' src="' + url(p) + '"></video>'
        + '</div>';
    };
    return '<div class="vdual">'
      + one("原片", srcPath, "vsrc")
      + one("处理后", outPath, "vout")
      + '</div>';
  }
  function videoPlayers(html){
    var seen = {}, tags = "";
    /* 视频走 mediad:8091 —— uhttpd 不支持 Range，手机播 mp4 拖不动进度。
     * 万一 mediad 没起来，onerror 退回 cgi（能播但不能拖）。 */
    var host = location.hostname || "127.0.0.1";
    String(html).replace(/href="\/cgi-bin\/agent\?file=([^"]+\.(?:mp4|m4v|webm|mov))/gi,
      function(_, p){
        if (seen[p]) return _;
        seen[p] = 1;
        var full = decodeURIComponent(p);
        var name = full.split("/").pop();
        var fast = "//" + host + ":8091/f/" + encodeURIComponent(name);
        var slow = "/cgi-bin/agent?file=" + p;
        tags += '<video class="vp" controls preload="metadata" playsinline '
              + 'src="' + fast + '" '
              + 'onerror="this.onerror=null;this.src=\'' + slow + '\';"></video>';
        return _;
      });
    return tags ? '<div class="vpwrap">' + tags + '</div>' : "";
  }

  /* 音频播放器单独放卡片底部：内联进表格单元格会把整行撑散 */
  function audioPlayers(html){
    var seen = {}, tags = "";
    String(html).replace(/href="\/cgi-bin\/agent\?file=([^"]+\.(?:mp3|wav|ogg))"/g,
      function(_, p){
        if (seen[p]) return _;
        seen[p] = 1;
        tags += '<audio class="ap" controls preload="none" src="/cgi-bin/agent?file='
              + p + '"></audio>';
        return _;
      });
    return tags ? '<div class="apwrap">' + tags + '</div>' : "";
  }

  /* ---- 音频播放器（DOM 版） ----
   * 见过太多"拼字符串拼坏属性"的坑：这里只在气泡插进 DOM 之后，
   * 找 a.fdl[href*=".mp3"]，用 createElement 造 <audio>，src 直接取 href。 */
  /* 上传图片后那个"修复这张图"按钮：直接发 fix 任务（走 image 插件 + realesrgan-rk3566） */
  document.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest('a.fixlink') : null;
    if (!a) return;
    ev.preventDefault();
    var p = a.getAttribute('data-p') || '';
    if (!p) return;
    var box = document.getElementById('input') || document.querySelector('textarea, input[type=text]');
    var sc = a.getAttribute('data-s') || '4';
    var txt;
    if (a.getAttribute('data-ocr')) txt = '{"op":"ocr","path":"' + p + '"}';
    else if (a.getAttribute('data-w')) txt = '{"op":"whiten","path":"' + p + '","strength":50}';
    else if (a.getAttribute('data-m')) txt = '{"op":"moire","path":"' + p + '","strength":' + (a.getAttribute('data-m') || 2) + '}';
    else txt = '{"op":"fix","path":"' + p + '","scale":' + sc + '}';
    if (window.sendTask) { window.sendTask(txt); return; }
    if (box) { box.value = txt; box.dispatchEvent(new Event('input')); }
  });

  function addAudioPlayers(root){
    if (!root || !root.querySelectorAll) return;
    /* 先清重复下载链接：同一 href 只留第一个。
     * 插件卡片的 dlall() 和 linkFiles() 会各自造一个（4→2），
     * 这里在 DOM 层兜一次底，不管谁造的都能收干净。 */
    try {
      var seen = {};
      var all = root.querySelectorAll ? root.querySelectorAll('a.fdl[href]') : [];
      for (var q = 0; q < all.length; q++) {
        var hq = all[q].getAttribute('href') || '';
        if (seen[hq]) { if (all[q].parentNode) all[q].parentNode.removeChild(all[q]); }
        else seen[hq] = 1;
      }
    } catch (e) {}
    /* 只给音频做播放器：以前没判扩展名，修复图产出的 .png 下载链接也被
     * 当成音频造了 <audio>，一次出两个空的播放器。 */
    /* 兜底：把"src 不是音频"的 <audio> 全部清掉。
     * 图片修复产物是 .png，如果哪条渲染路径把它当音频造了播放器，这里会收拾干净。 */
    try {
      Array.prototype.forEach.call(root.querySelectorAll('audio'), function(au){
        var src = (au.getAttribute('src') || '').toLowerCase();
        if (!/(mp3|wav|m4a|ogg|aac|flac)/.test(src)) {
          if (au.parentNode) au.parentNode.removeChild(au);
        }
      });
    } catch (e) {}

    /* 图片结果直接在气泡里显示预览：以前只有下载链接，用户看不到修复后的样子 */
    try {
      Array.prototype.forEach.call(root.querySelectorAll('a.fdl[href]'), function(a){
        var h = (a.getAttribute('href') || '');
        if (!/\.(png|jpg|jpeg|bmp|webp)(%|&|$|")/i.test(h) && !/\.(png|jpg|jpeg|bmp|webp)(%|$)/i.test(h)) return;
        if (a.getAttribute('data-prev')) return;
        a.setAttribute('data-prev', '1');
        var im = document.createElement('img');
        im.src = h;
        im.className = 'imgprev';
        im.loading = 'lazy';
        im.onclick = function(){ window.open(h, '_blank'); };
        a.parentNode && a.parentNode.insertBefore(im, a);
      });
    } catch (e) {}

    var links = Array.prototype.filter.call(root.querySelectorAll('a.fdl[href]'), function(a){

  /* 插件返回的是 JSON（{"value":...} / {"text":...} / {"value":"| 表格 |"}），

     这里解出有意义的字段，表格/公式再交给 render 渲染。 */
  /* doc 读出来的正文是"制表符分列、换行分行"（xlsx 就长这样）。直接丢给
     markdown 渲染会被压成一坨 —— 制表符不是分隔符，用户看到的就是
     "一堆挤压在一起的文字"。这里认出表格形状就转成真正的 markdown 表格。 */
  function dataToMd(txt, maxRows){
    var lines = String(txt || "").split("\n").filter(function(L){ return L.trim() !== ""; });
    if (lines.length < 2) return null;
    var first = lines[0];
    var sep = /^\s*\|/.test(first) ? "|" : (first.indexOf("\t") >= 0 ? "\t" : null);
    if (!sep) return null;
    var cells = function(L){
      if (sep === "|") return L.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|");
      return L.split("\t");
    };
    var head = cells(first);
    if (head.length < 2) return null;
    var n = Math.min(lines.length, (maxRows || 20) + 1);
    var clean = function(x){ return String(x).trim().replace(/\|/g, "｜"); };
    var out = ["| " + head.map(clean).join(" | ") + " |",
               "|" + head.map(function(){ return " --- "; }).join("|") + "|"];
    for (var i = 1; i < n; i++){
      var c = cells(lines[i]);
      while (c.length < head.length) c.push("");
      out.push("| " + c.slice(0, head.length).map(clean).join(" | ") + " |");
