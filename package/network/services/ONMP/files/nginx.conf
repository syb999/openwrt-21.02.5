# ONMP nginx instance - private config, do not merge with /etc/nginx/nginx.conf
# @PORT@ @ROOT@ @FPM@ are substituted by /etc/init.d/onmp from /etc/config/onmp
pid /var/run/onmp-nginx.pid;
error_log stderr warn;
user root;
worker_processes auto;

events {
	use epoll;
	multi_accept on;
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	charset utf-8;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 60;
	server_tokens off;

	client_max_body_size 2000m;
	client_body_temp_path /var/lib/onmp/nginx/body;
	fastcgi_temp_path /var/lib/onmp/nginx/fastcgi;
	proxy_temp_path /var/lib/onmp/nginx/proxy;

	access_log /var/log/onmp/access.log;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_min_length 1k;
	gzip_comp_level 2;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

	server {
		listen @PORT@ default_server;
		server_name _;
		root @ROOT@;
		index index.php index.html index.htm;

		location ~ \.php(?:$|/) {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass unix:@FPM@;
			fastcgi_index index.php;
			include /etc/onmp/fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
		}

		location / {
			try_files $uri $uri/ =404;
		}
	}

	include /etc/onmp/vhosts/*.conf;
}
