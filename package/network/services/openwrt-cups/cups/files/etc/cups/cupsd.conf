########################################################################
#                                                                      #
# CUPS 2.3.3 配置 (OpenWrt / Nokia XG-040G-MF)                          #
#                                                                      #
# 说明:                                                                 #
#  - 原包里的这份 conf 是 CUPS 1.x 配方 (BrowsingWebIF / DefaultShared #
#    等), 2.3 会当 "Unknown directive" 记错误日志 (不致命但噪音大);     #
#  - 关键修正: 允许来源改成全部私有网段 —— 原来写死 192.168.1.0/24,     #
#    换一个 LAN 网段 PC 连上来就是 403 Forbidden, 打不了。              #
#  - 本机 lpadmin (走 /var/run/cups/cups.sock, root) 不受这些限制。      #
#                                                                      #
########################################################################

LogLevel warn
MaxLogSize 0
ErrorLog syslog
AccessLog syslog
PageLog syslog
PreserveJobHistory No
PreserveJobFiles No
AutoPurgeJobs Yes
MaxJobs 25

# root 才能用 usb backend 直接开 /dev/usb/lp0 (User/Group 在 cups-files.conf)
RIPCache auto
TempDir /var/cups

Port 631
Listen /var/run/cups/cups.sock

HostNameLookups On
KeepAlive On
Browsing Off
WebInterface Yes
DefaultAuthType Basic

ServerAlias *

<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

<Location /admin>
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>
