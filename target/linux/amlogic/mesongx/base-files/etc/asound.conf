# Onboard SPDIF is the default output (always present).
# The USB DAC (3.5mm) is available as the named device "dacvol".
#
# The mainline meson AIU driver has no hardware volume at all (SPDIF is a pure
# digital output, the AIU has no gain stage), so the onboard card only shows
# 'AIU SPDIF SRC SEL' in alsamixer.  Volume is done with softvol (digital
# attenuation).

pcm.!default {
    type plug
    slave.pcm "spdifvol"
}

pcm.spdifvol {
    type softvol
    slave.pcm "hw:0,1"
    control {
        name "SPDIF Volume"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
    resolution 100
}

# USB DAC / 3.5mm jack: mpg123 -a dacvol URL
pcm.dacvol {
    type softvol
    slave.pcm "hw:DAC,0"
    control {
        name "DAC Volume"
        card DAC
    }
    min_dB -51.0
    max_dB 0.0
    resolution 100
}


# 3.5mm jack (ES7134V, AIU I2S -> GPIOAO_8..11): mpg123 -a avout URL
pcm.avout {
    type plug
    slave.pcm "avout_softvol"
}

pcm.avout_softvol {
    type softvol
    slave.pcm "hw:0,0"
    control {
        name "AV Volume"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
    resolution 100
}

ctl.!default {
    type hw
    card 0
}
